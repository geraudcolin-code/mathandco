:root{--encre:#17233A;--papier:#FFFFFF;--carreau:#E2EBF6;--marge:#E8A1A1;--rouge:#D62828;--jaune:#FFD757;
  --pastille:#CFE2F8;--orange:#E2702A;--gris:#6B7483;--rose:#B05AC0;--fond:#E7ECF2;--panneau:#F6F8FB;
  --trait:#CFD9E5;--lettrebox:#C9D3DE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lettrebox:#1D242E}}
:root[data-theme="dark"]{--lettrebox:#1D242E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lettrebox);overflow:hidden}
#app{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--fond);
  font-family:'Lex',Lexend,'Segoe UI',Verdana,sans-serif;color:var(--encre);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}

/* ---------- bandeau : titre, consigne, les dix fonctions */
#bandeau{position:absolute;left:0;top:0;width:1600px;height:68px;display:flex;align-items:center;gap:18px;
  padding:0 14px 0 18px;background:var(--papier);border-bottom:1px solid var(--trait)}
#titre{flex:0 0 auto;width:470px;line-height:1.12}
#titre .ex{font-size:22px;font-weight:700}
#titre .cons{font-size:13px;color:var(--gris);margin-top:3px;white-space:normal}
#vignettes{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.vig{position:relative;height:54px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);
  cursor:pointer;overflow:hidden;padding:4px 6px 0;text-align:left}
.vig .num{font-size:13px;font-weight:700;color:var(--gris)}
.vig .f{position:absolute;left:6px;right:5px;bottom:5px;font-size:12px;white-space:nowrap;line-height:1}
.vig .f svg{max-width:100%;height:auto}
.vig:hover{border-color:#9DB2CB}
.vig.cur{border:2.5px solid var(--rouge);background:#FFF8F7}
.vig.cur .num{color:var(--rouge)}

/* ---------- page de cahier */
#page{position:absolute;left:10px;top:76px;width:1580px;height:776px;background:var(--papier);
  border:1px solid var(--trait);border-radius:4px;overflow:hidden}
#defil{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;
  background-image:linear-gradient(var(--carreau) 1px,transparent 1px),linear-gradient(90deg,var(--carreau) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
#defil::-webkit-scrollbar{width:10px}#defil::-webkit-scrollbar-thumb{background:#C5D2E1;border-radius:5px}
.fn{display:none;position:relative;padding:20px 30px 160px 100px;min-height:100%}
.fn.cur{display:block}
.fn::before{content:'';position:absolute;left:74px;top:0;bottom:0;border-left:2px solid var(--marge);pointer-events:none}
.fnum{position:absolute;left:20px;top:22px;width:44px;text-align:right;font-size:32px;font-weight:700;color:var(--rouge)}
.ftitre{font-size:38px;margin:0 0 18px;display:inline-block;position:relative}
.ln{font-size:26px;line-height:1.3;position:relative;white-space:nowrap}
.ln b{font-weight:700}
.ln.texte{white-space:normal;max-width:830px}
.mx svg{overflow:visible}
.gris{color:var(--gris)}.rose{color:var(--rose);font-weight:700}.orange{color:var(--orange)}
.hl{background:var(--jaune);padding:3px 9px;margin-left:5px;display:inline-block;border-radius:6px}
.chain{display:grid;grid-template-columns:max-content max-content max-content;align-items:center;
  column-gap:10px;row-gap:8px;font-size:26px}
.chain .lhs{justify-self:end}
.chain .note{grid-column:1 / span 3;justify-self:start;font-size:24px;color:var(--orange);padding-left:150px}
svg.ovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.under{z-index:0}.contenu{position:relative;z-index:1}svg.over{z-index:2}

/* ---------- étapes */
[data-in]{opacity:0;transition:opacity .28s ease}
[data-in].on{opacity:1}
span.tx[data-in],span.mx[data-in],div.ln[data-in]{clip-path:inset(-250% 100% -250% -4%);
  transition:opacity .2s ease,clip-path .45s ease}
span.tx[data-in].on,span.mx[data-in].on,div.ln[data-in].on{clip-path:inset(-250% -6% -250% -4%)}
#app.saut *{transition:none!important}

/* ---------- panneau d'outils */
#panneau{position:absolute;left:968px;top:88px;width:612px;height:752px;background:var(--panneau);
  border:1px solid var(--trait);border-radius:10px;display:flex;flex-direction:column;z-index:5;
  box-shadow:0 10px 30px rgba(23,35,58,.16),0 1px 3px rgba(23,35,58,.10);transition:transform .35s ease,opacity .35s ease}
#panneau.ferme{transform:translateX(640px);opacity:0;pointer-events:none}
#rabat{position:absolute;right:10px;top:12px;border:none;background:none;font-size:15px;color:var(--gris);cursor:pointer;padding:4px 8px}
#rouvrir{position:absolute;right:10px;top:96px;z-index:4;border:1.5px solid var(--trait);background:var(--papier);border-radius:8px;
  padding:10px 9px;font-size:15px;font-weight:700;color:var(--encre);cursor:pointer;writing-mode:vertical-rl;transform:rotate(180deg);display:none}
#panneau.ferme ~ #rouvrir{display:block}
#onglets{display:flex;gap:2px;padding:10px 90px 0 10px;border-bottom:1px solid var(--trait)}
.ong{flex:1;border:none;background:none;padding:9px 4px 11px;font-size:16px;font-weight:700;color:var(--gris);
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ong .k{font-weight:400;font-size:13px;color:#98A1AE;margin-left:5px}
.ong.cur{color:var(--encre);border-bottom-color:var(--encre)}
.ong.signal{color:var(--rouge)}
.vue{display:none;flex:1;padding:16px 6px 10px;position:relative;overflow:hidden}
.vue.cur{display:block}
.legende{font-size:15px;color:var(--gris);margin:0 0 10px 0;line-height:1.35}
.capt{position:relative;display:inline-block;max-width:100%}
.capt img{display:block;width:100%;height:auto;box-shadow:0 2px 0 rgba(23,35,58,.08)}
#v-enonce .capt,#v-cours .capt{width:596px}
.cadre{position:absolute;border:3px solid var(--rouge);pointer-events:none}
.souligne{position:absolute;height:0;border-top:3.5px solid #3B6FB6;pointer-events:none}
#listeCours{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.puce{border:1.5px solid var(--trait);background:var(--papier);border-radius:16px;padding:5px 12px;font-size:15px;cursor:pointer}
.puce.cur{border-color:var(--encre)}
#rien{font-size:17px;color:var(--gris);padding:10px 4px}
/* graphique */
#gsvg{display:block;width:596px;height:454px;background:var(--papier);border:1px solid var(--trait);border-radius:4px}
#gzone{position:relative;width:596px}
#gdef{position:absolute;background:#FFFFFF;border:1.5px solid #1F5FAF;border-radius:6px;padding:4px 9px;color:#1F5FAF;font-size:17px;white-space:nowrap}
#gctl{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--trait);background:var(--papier);border-radius:6px;padding:6px 12px;font-size:15px;cursor:pointer}
.btn:hover{border-color:#9DB2CB}
.btn.on{background:var(--encre);color:#fff;border-color:var(--encre)}
#gfen{font-size:14px;color:var(--gris);margin-left:auto}
/* valeurs */
#tables{display:flex;gap:18px}
table.val{border-collapse:collapse;font-size:18px;flex:1;background:var(--papier)}
table.val caption{font-size:16px;color:var(--gris);text-align:left;padding-bottom:6px}
table.val th,table.val td{border:1px solid var(--trait);padding:7px 10px;text-align:right;white-space:nowrap}
table.val th{background:#EEF3F9;font-weight:700}

/* ---------- barre du bas */
#barre{position:absolute;left:0;top:856px;width:1600px;height:44px;display:flex;align-items:center;gap:9px;
  padding:0 18px;background:var(--papier);border-top:1px solid var(--trait)}
.ico{width:42px;height:34px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
#pas{font-size:17px;min-width:150px}
#piste{position:relative;width:250px;height:6px;background:#E3E9F1;border-radius:3px;overflow:hidden}
#remplir{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--encre);transition:width .25s}
.esp{flex:1}
#sig{font-size:13px;color:#8C95A3;margin-left:6px}
#bAuto{position:relative;width:auto;padding:0 12px 0 8px;gap:7px;font-size:15px;font-weight:700}
#bAuto svg.anneau{width:24px;height:24px}
#bAuto .fond{fill:none;stroke:#E3E9F1;stroke-width:3}
#bAuto .prog{fill:none;stroke:var(--rouge);stroke-width:3;stroke-dasharray:62.8;stroke-dashoffset:62.8;transform:rotate(-90deg);transform-origin:12px 12px}
#bAuto.lecture{border-color:var(--rouge)}
.vit{display:flex;border:1.5px solid var(--trait);border-radius:7px;overflow:hidden}
.vit button{border:none;background:var(--papier);padding:6px 10px;font-size:14px;cursor:pointer;color:var(--gris)}
.vit button.cur{background:var(--encre);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#bandeau #titre{width:400px}
#bandeau #titre .ex{font-size:18px}
#bandeau .vig{padding:3px 2px 0;text-align:center}
#bandeau .vig .num{font-size:12px}
#bandeau .vig .f{font-size:10px;letter-spacing:-.2px}
.fn .partie{font-variant:small-caps;letter-spacing:.3px;margin:18px 0 10px}
.fn .souspartie{margin:18px 0 10px}
.fn .texte{margin-top:10px}
.fn .exm{margin:24px 0 8px;white-space:normal}
.fn .exn{font-variant:small-caps;font-weight:700;letter-spacing:.4px}
.fn .q{margin:22px 0 10px;border-bottom:1.6px solid #000;padding-bottom:3px;white-space:normal}
.fn .exm.q{margin-top:24px}
.fn .ln.dl{margin-top:30px}
.fn .cadrep{color:#800000}
.fn .cadrep .ct{margin-bottom:4px}
.fn .cadrep .ln{margin-top:12px}
.fn .cadrep .ni{position:relative;margin:16px 0 0 34px;padding-left:34px}
.fn .cadrep .ni .nn{position:absolute;left:0;top:0;font-weight:700}
.fn .ni{position:relative;margin:14px 0 0 34px;padding-left:34px}
.fn .ni .nn{position:absolute;left:0;top:0}
.fn .tri{display:inline-block;width:0;height:0;border-left:15px solid currentColor;border-top:8px solid transparent;
  border-bottom:8px solid transparent;margin:0 9px 0 2px;vertical-align:1px}
.fn .pt{margin-top:14px}
.fn .rem .pt{margin-top:16px}
.fn .vague{position:relative;padding-left:46px;margin-top:8px}
.fn .vague.avecico{padding-left:52px}
.fn .vague::before{content:'';position:absolute;left:-2px;top:6px;bottom:4px;width:12px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='14'><path d='M6 0 Q11 3.5 6 7 Q1 10.5 6 14' fill='none' stroke='black' stroke-width='1.4'/></svg>") repeat-y}
.fn .vague.avecico::before{top:48px}
.fn .vague .vico{position:absolute;left:-34px;top:-6px}
.fn .figw{position:relative;flex:none}
.fn .figw > img{position:absolute;left:0;top:0;width:100%;height:100%}
.fn .figw .lb{position:absolute;display:flex;align-items:center;white-space:nowrap;line-height:1;transform:translate(-50%,-50%)}
.fn .figw .lb .tx{white-space:nowrap}
.fn .figw svg.lbs{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fn .figw svg.lbs line[data-in]{transition:opacity .3s ease}
.fn .figi{display:block}
.fn .dcol{display:grid;column-gap:26px;align-items:start}
.fn .dcol .sep{background:#000;width:1.5px;align-self:stretch}
.fn .trou.ind{font-size:.72em;vertical-align:-.42em;padding:0 2px}
.fn .acc{display:inline-flex;align-items:center;vertical-align:middle}
.fn .acc .br{display:inline-block;margin-right:4px}
.fn .acc .li{display:flex;flex-direction:column;gap:8px}
.fn .carre{float:right;font-size:22px;margin-top:-30px}
.fn .carre-fin{float:right;margin-right:6px}
.fn .cr.libre{width:auto;column-gap:0;align-items:baseline}
.fn .cr.libre .trou.plein{min-width:0}
.fn .cr.libre .trou.c0{padding-right:6px}
.fn .trou.bleu::after{background:radial-gradient(circle at 3px 3px,#0000FF 1.6px,transparent 2.1px) 0 0/8px 6px repeat-x}
.fn .cr.pc{row-gap:22px}

/* ---------- données de l'énoncé, chemins, halos */
.fn .dat{border-radius:4px}
.fn .repere{display:inline-block;width:0;height:0;vertical-align:bottom}
.fn .figw svg.chs{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fn .figw path.chem{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.62;stroke-dasharray:var(--L);
  stroke-dashoffset:var(--L);transition:stroke-dashoffset 1.15s cubic-bezier(.3,.6,.3,1),opacity .3s ease}
.fn .figw path.chem.on{stroke-dashoffset:0}
.fn .figw .chn{fill:none;stroke-opacity:.85;transition:opacity .35s ease .95s}
.fn .figw .lb .halo{position:absolute;inset:-6px -9px;border-radius:999px;filter:blur(1.2px);z-index:-1}
.fn .figw .lb.fz{mix-blend-mode:multiply}
.fn .figw .lb.fz .halo{inset:-4px;border-radius:12px;filter:none;box-shadow:inset 0 0 0 3px #17233A}
.fn .figw .lb.fz .halo[data-in].on{opacity:.8}
[data-hin]{opacity:0;transition:opacity .28s ease}
[data-hin].on{opacity:1}
/* ---------- feuille resserrée quand le volet est ouvert (facteur --k, poly1c3_anim.js : zoomCalculer) */
.fn > svg.ovl{transform-origin:0 0}
.fn.serre > .contenu, .fn.serre > svg.ovl{transform:scale(var(--k))}
/* ---------- le volet (à droite de la scène, au-dessus de la feuille ; sa poignée reste dans la marge) */
.tiroir{position:fixed;top:82px;right:12px;bottom:52px;z-index:7;display:flex;align-items:stretch;
  transform:translateX(calc(100% - 44px));transition:transform .5s cubic-bezier(.2,.7,.2,1),bottom .4s ease;
  font-family:inherit;pointer-events:none}
.tiroir.ouvert{transform:none}
.tiroir > *{pointer-events:auto}
.tir-poignee{flex:0 0 44px;align-self:center;height:210px;border:none;border-radius:12px 0 0 12px;background:#17233A;color:#FFFFFF;
  cursor:pointer;box-shadow:-4px 6px 16px rgba(23,35,58,.25);display:flex;align-items:center;justify-content:center;padding:0}
.tir-poignee span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:17px;font-weight:600;letter-spacing:.6px}
.tiroir.ouvert .tir-poignee{background:#3B4E6E}
.tir-poignee:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}
.tir-corps{flex:1;min-width:0;background:#FFFFFF;border:1.5px solid #CFD9E5;border-radius:12px 0 0 12px;
  box-shadow:-10px 12px 34px rgba(23,35,58,.20);display:flex;flex-direction:column;overflow:hidden}
.tir-onglets{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px 0}
.tir-onglets button{font:inherit;font-size:15px;font-weight:600;padding:6px 14px;border:1.5px solid #CFD9E5;border-radius:8px;
  background:#F4F7FB;color:#17233A;cursor:pointer}
.tir-onglets button.cur{background:#17233A;color:#FFFFFF;border-color:#17233A}
.tir-vue{display:none;flex:1;flex-direction:column;align-items:center;padding:10px 14px 12px;overflow:hidden;min-height:0}
.tir-vue.cur{display:flex}
.tir-titre{align-self:stretch;font-size:18px;font-weight:600;color:#17233A;margin:0 0 10px;line-height:1.25}
.tir-vue .copies{flex:none;display:flex;flex-direction:column;align-items:center}
.tir-vue .copie{flex:none;margin-top:6px;overflow:hidden;position:relative}
.tir-vue .copie > div{position:absolute;left:0;top:0}
.fn .figw svg.hlf{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;mix-blend-mode:multiply}
.tir-vue .copie .figw{position:relative}
.tir-marques{display:none}
.xp-note{align-self:stretch;font-size:14px;color:#5B6878;margin:-4px 0 6px;line-height:1.3}
.xp-svg{flex:none;font-family:inherit}
.xp-btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.xp-btns button{font:inherit;font-size:15px;font-weight:600;padding:7px 14px;border-radius:8px;border:1.5px solid #17233A;
  background:#FFFFFF;color:#17233A;cursor:pointer}
.xp-btns .xp-go{background:#17233A;color:#FFFFFF}
.xp-btns button:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}
.xp-res{align-self:stretch;margin-top:10px;font-size:17px;line-height:1.45;color:#17233A;min-height:60px;flex:1 1 auto;overflow-y:auto}
.xp-res sup{font-size:.65em}
.xp-res .bilan{margin-top:4px;padding-top:4px;border-top:1px solid #DCE3EC}
.tir-vue .rappel{align-self:stretch;display:flex;flex-direction:column;gap:14px;margin-top:16px;font-size:21px;color:#17233A;
  line-height:1.35}
.tir-vue .rappel .rs{position:relative;display:inline-block;padding:3px 8px;z-index:0}
.tir-vue .rappel .halo{position:absolute;inset:-3px -6px;border-radius:999px;filter:blur(1.2px);z-index:-1}
@media (prefers-reduced-motion: reduce){ .tiroir{transition:none} .fn .figw path.chem{transition:none} }

/* trois zones : énoncé collé à gauche | correction | volet (toujours ouvert) */
#defil .fn{width:1100px;padding:14px 18px 20px 18px}
/* la marge du bas est DANS la grille : l'énoncé collé (sticky) reste entier à l'écran jusqu'au bout de la correction */
.fn .cocol{padding-bottom:520px}
#cours{width:1100px}
.fn .exgrid{display:grid;grid-template-columns:470px minmax(0,1fr);column-gap:24px;align-items:start}
.fn .encol{position:sticky;top:0;align-self:start;max-height:744px;overflow-y:auto;overflow-x:hidden;font-size:18px;
  line-height:1.32;padding:4px 12px 12px 2px;border-right:2px solid #CFD9E5;scrollbar-width:thin}
.fn .encol > *:not(svg){position:relative;z-index:1}
.fn .encol svg.ensvg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:0}
.fn .encol .enonce{margin:0}
.fn .encol .texte{margin-top:7px}
.fn .encol .exn{font-weight:700;font-size:20px}
.fn .encol .qn{margin-top:9px;padding-left:24px;position:relative}
.fn .encol .qn b.n{position:absolute;left:0}
.fn .encol .qn.cur{background:#FFF3F3;border-left:4px solid #D62828;padding-left:30px;margin-left:-8px}
.fn .encol .qn.cur b.n{left:8px}
.fn .encol ul{margin:5px 0 0 4px;padding-left:22px}
.fn .encol li{margin-top:3px}
.fn .cocol{min-width:0;font-size:24px}
.fn .cocol .ln{font-size:24px}
.fn .corr{font-variant:small-caps;font-weight:700;color:#17233A;font-size:26px;letter-spacing:.4px;margin:4px 0 4px;
  border-bottom:2px solid #17233A;padding-bottom:2px}
.fn .ln.cor{white-space:normal}
.fn .cocol span.tx[data-in],.fn .cocol span.tx[data-in].on{clip-path:none}
.fn .cr.calc{row-gap:22px;column-gap:6px;margin-top:14px}
.fn .cr.calc .lab{text-align:right}
.fn .just{color:#5B6878;font-size:19px;margin-left:12px}
/* conclusion d'une question : encadrée (règle du projet, 12 octobre au soir) ; le cadre vient avec son premier morceau */
.fn .ln.concl{width:fit-content;max-width:100%;box-sizing:border-box;padding:7px 16px 8px;border:2.5px solid transparent;
  border-radius:10px;transition:border-color .35s ease,background-color .35s ease}
.fn .ln.concl:has(.on){border-color:#D62828;background:#FFF6F6}
/* programmes recopiés (exercices 11, 13, 15) : trous de l'énoncé, réponses en rouge ; tableaux d'effectifs */
.fn .code.ex{background:#F7F9FC;margin-bottom:2px;max-width:calc(100% - 60px)}
.fn .code .ctrou > span:not(.on){display:none}
.fn .code .ctrou .rep{color:#D62828;font-weight:700}
.fn .code .ctrou .pts{color:#8C96A5}
.fn .code .st{color:#B5651D}
.fn .code .no{width:26px}
.fn .ln.concl.codec:has(.on){border-color:transparent;background:none}
.fn .ln.concl.codec:has(.mk.on){border-color:#D62828;background:#FFF6F6}
.fn .ln.concl.codec .code.ex{margin-top:4px!important}
.fn table.etat.ex td{min-width:64px;height:40px}
.fn table.etat.ex td.lab{min-width:44px}
/* volet caché à la main : la correction prend la place laissée libre */
#defil .fn.large{width:1480px}
.tir-vue .rappel.carte{gap:12px;margin-top:6px;font-size:20px}
.tir-vue .rappel.carte .rl:first-child .rs{font-weight:600}

.fn .ftitre{display:none}
.ln .lhs7{display:inline-block;text-align:right;margin-right:6px}
.ovl path.trace{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset 1.1s cubic-bezier(.22,.6,.3,1)}
.ovl .on path.trace{stroke-dashoffset:0}
.ovl path.pointe{opacity:0;transition:opacity .25s ease .9s}
.ovl .on path.pointe{opacity:1}
.vig .f .katex{font-size:1em}.vig .f .katex svg{max-width:none;height:inherit}
.vig .num{position:relative;z-index:1}.vig .f{bottom:3px}
.ln .gap{display:inline-block;width:14px}
.kc{font-family:Consolas,'DejaVu Sans Mono',monospace;color:#1F3864}
.kc.rouge{color:#C00000}
.code{position:relative;display:inline-block;margin:8px 0 6px 64px;padding:10px 20px 10px 14px;background:#F7F9FC;
  border:1.5px solid var(--trait);border-radius:8px;font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:21px;line-height:34px}
.code .cl{white-space:pre}.code .no{color:#8C96A5;display:inline-block;width:30px}
.code .kw{color:#1F3864;font-weight:700}.code .nb{color:#2E8B57}
.fleche{position:absolute;left:-52px;top:8px;width:44px;height:38px}
.fleche[data-in]{transition:transform .55s ease,opacity .25s ease}
.etat{border-collapse:collapse;margin:6px 0 4px 0;font-size:24px;background:#FFFFFF}
.etat td{border:1.5px solid #8C96A5;min-width:62px;height:42px;text-align:center;padding:0 6px;position:relative}
.etat td.lab{background:#EEF3F9;font-weight:700;min-width:46px}
.etat.petit{font-size:21px}.etat.petit td{min-width:44px;height:36px;padding:0 4px}.etat.petit td.lab{min-width:38px}
.etat td.points{color:#8C96A5}
.cadreb{display:inline-block;border:2px solid;border-radius:9px;padding:8px 16px 10px;margin:8px 0 4px}
.cadreb.vert{border-color:#548235;background:#F3F8EF}.cadreb.bleu{border-color:#2E75B6;background:#EEF5FC}
.cadreb .ttl{font-weight:700;color:#375623;margin-bottom:2px}
.tsig{border-collapse:collapse;margin:6px 0 4px 0;font-size:24px;background:#FFFFFF}

.tsig td.lab{border-right:1.5px solid #5E6B7D;border-left:1.5px solid #5E6B7D;text-align:left;padding:0 12px;min-width:200px}
.tsig td.last{border-right:1.5px solid #5E6B7D}
.tsig td.iv{min-width:150px}.tsig td.bd{width:30px;position:relative}
.tsig td.racine{background:linear-gradient(#5E6B7D,#5E6B7D) no-repeat center/1.5px 100%}
.tsig td.racine > span{background:#FFFFFF;position:relative}

/* ---------- la feuille (A4 : 19 cm de texte -> 1280 px ; 12 pt -> 27 px), calée à gauche ; à sa droite, la marge */
#titre{width:452px}#titre .ex{font-size:19px}#titre .cons{font-size:12px;margin-top:2px}
#vignettes{gap:6px}
.vig{padding-top:3px}.vig .num{display:block;line-height:1.1}.vig .f{position:static;display:block;font-size:11px;color:var(--encre);white-space:normal;line-height:1.1}
#page{left:24px;width:1566px;background:transparent;border:none;border-radius:0}
#defil{background-image:none}
.fn{width:1420px;padding:22px 70px 300px 70px;min-height:100%;font-size:27px;line-height:1.3;color:#000;background:#FFFFFF;
  border:1px solid var(--trait);border-radius:4px;box-shadow:0 2px 12px rgba(23,35,58,.10)}
.fn::before{display:none}
.fn .ln{font-size:27px}
.fnum{display:none}
.entete{font-size:16px;color:#333;margin:0 0 4px}
.titre1{text-align:center;font-size:40px;font-weight:700;margin:4px 0 4px;line-height:1.15}
.titre1b{text-align:center;font-size:22px;font-variant:small-caps;letter-spacing:.5px;margin:0 0 22px}
.partie{color:#0000FF;font-size:40px;font-weight:700;margin:22px 0 6px;line-height:1.15}
.souspartie{color:#0000FF;font-size:32px;font-weight:700;margin:20px 0 8px;line-height:1.15}
.texte{white-space:normal}
.ln{white-space:nowrap}
.ln.texte{max-width:none}
.ln.lnf{display:flex;align-items:baseline;white-space:nowrap}
.gras{font-weight:700}.it{font-style:italic}
.cadrep{border:1.6px solid #000;border-radius:16px;padding:8px 18px 14px 14px;margin:10px 0 16px;color:#800000}
.cadrep .ct{font-weight:700}
.cadrep .pt{position:relative;margin:12px 0 0 52px;padding-left:34px}
.cadrep .pt::before{content:'•';position:absolute;left:4px;top:-2px;font-size:30px}
.cadrep .pt.arcs{margin-top:34px}
.pt.rem{color:#000}
.rem .pt{position:relative;margin:10px 0 0 30px;padding-left:34px}
.rem .pt::before{content:'•';position:absolute;left:4px;top:-2px;font-size:30px}
.ex{margin:24px 0 10px;border-bottom:1.5px solid #000;padding-bottom:4px;white-space:normal}
.ex .exn{font-variant:small-caps;font-weight:700;font-size:28px;letter-spacing:.4px}
.etape{margin:18px 0 0;white-space:normal}
.etape sup{font-size:.6em}
.centre{display:flex;flex-direction:column;align-items:center}
.cols{display:grid;grid-template-columns:1fr 2px 1fr;column-gap:26px;margin:4px 0 0;align-items:start}
.cols .sep{background:#000;width:1.5px;height:100%;min-height:60px}
.cols .col{display:flex;flex-direction:column;align-items:center}
.cols .col.g{align-items:flex-start}
.cr{display:grid;align-items:baseline;column-gap:10px;row-gap:30px;margin-top:30px;width:fit-content}
.cr .lab{text-align:right}
.cr .rel{text-align:center}
.cr .pre{text-align:left}
.mx svg{overflow:visible}
/* ---------- pointillés */
.trou{display:inline-block;position:relative;min-width:var(--w,160px);padding:0 7px;vertical-align:baseline;
  white-space:nowrap;text-align:left}
.trou.al-right{text-align:right}.trou.al-center{text-align:center}
.trou .bl{display:inline-block;width:0;height:0;vertical-align:baseline}      /* repère de la ligne de base (JS : --bl) */
/* les points sont sur la ligne de base (comme \dotfill), quelle que soit la hauteur de ce qui est écrit (fractions) ;
   ils ne restent que dans la place libre : après ce qui est écrit (--dx, calculé à chaque clic), ou avant pour un
   pointillé calé à droite (--dr) */
.trou::after{content:'';position:absolute;left:var(--dx,4px);right:4px;bottom:5px;height:6px;pointer-events:none;
  background:radial-gradient(circle at 3px 3px,#3a3a3a 1.6px,transparent 2.1px) 0 0/8px 6px repeat-x;transition:left .35s ease,right .35s ease}
.trou[style*="--bl"]::after{top:calc(var(--bl) - 2px);bottom:auto}
.trou.al-right::after{left:4px;right:var(--dr,4px)}
.trou.fill{flex:1 1 auto;min-width:40px}
.trou .alt{position:absolute;left:7px;top:0;white-space:nowrap}
.ptl{position:relative;height:50px;margin-top:6px;white-space:nowrap}
.ptl::after{content:'';position:absolute;left:var(--dx,4px);right:4px;bottom:9px;height:6px;pointer-events:none;
  background:radial-gradient(circle at 3px 3px,#3a3a3a 1.6px,transparent 2.1px) 0 0/8px 6px repeat-x;transition:left .35s ease}
.ptl .tx,.ptl .mx{position:relative;top:7px}
.vide{min-height:0}
.brace{display:inline-block;vertical-align:middle}
.sys{display:inline-flex;align-items:center;gap:4px;margin:0 6px}
.sys .lig{display:grid;grid-template-columns:auto 34px auto;align-items:baseline;column-gap:8px;margin:4px 0}
.fig{display:block;margin:0 auto}
.fig g[data-in]{transition:opacity .4s ease}
/* ---------- le post-it de marge (collé au bord droit de la feuille, à la hauteur de la ligne en cours ; son bord
   droit est calé à 1576 px de la scène, il s'élargit vers la gauche si une ligne est longue) */
.marge{position:absolute;right:-202px;width:max-content;min-width:196px;padding:7px 9px 10px 11px;background:#FFF6C4;
  border:1px solid #E6D37A;border-radius:3px;box-shadow:3px 5px 14px rgba(51,51,51,.30);font-size:21px;line-height:1.25;
  color:#000;white-space:nowrap;z-index:3;transform:rotate(-1.4deg) translateX(16px);transition:opacity .3s ease,transform .3s ease}
.marge.on{transform:rotate(-1.4deg)}
.marge .mt{font-size:14px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#7D6A12;margin:0 0 3px}
.marge .ml{margin-top:3px}
.marge .ml.ab{font-size:24px;margin-top:5px}
.marge .ml.ab .tx{font-size:19px;color:#333}
/* ---------- la règle du cours, en bas de la page */

#panneau,#rouvrir{display:none!important}

function demarrer(DATA){

const SCR = DATA.SCREENS, ITEMS = DATA.ITEMS, IMGS = DATA.IMGS, DEFS = DATA.DEFS;
const app = document.getElementById('app'), defil = document.getElementById('defil');
let scale = 1, cur = 0, step = 0, tab = 'enonce', coursManuel = null, vue = null, points = false;
function fit(){ const W = innerWidth, Hh = innerHeight; scale = Math.min(W / 1600, Hh / 900);
  app.style.transform = `translate(${(W - 1600*scale)/2}px,${(Hh - 900*scale)/2}px) scale(${scale})`; }
addEventListener('resize', fit); fit();
document.querySelectorAll('img[data-src]').forEach(im => { im.src = IMGS[im.dataset.src]; });
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, a, p){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function rel(el, ref){ if (el.classList && el.classList.contains('mx')){ const s = el.querySelector('.katex-html') || el.querySelector('svg'); if (s) el = s; }
  const r = el.getBoundingClientRect(), q = ref.getBoundingClientRect();
  return {x:(r.left - q.left)/scale, y:(r.top - q.top)/scale, w:r.width/scale, h:r.height/scale}; }
function head(g, x, y, ang, col){ const a = .45, L = 15;
  mk('path', {d:`M${x},${y} L${x - L*Math.cos(ang - a)},${y - L*Math.sin(ang - a)} L${x - L*Math.cos(ang + a)},${y - L*Math.sin(ang + a)} Z`, fill:col}, g); }

/* ------------------------------------------------ surimpressions de la page (calculées à l'entrée) */
function construire(i){
  const sc = SCR[i], sec = document.getElementById('fn' + i);
  if (sec.dataset.ok) return;
  const U = sec.querySelector('svg.under'), O = sec.querySelector('svg.over');
  const B = id => rel(document.getElementById(id), sec);
  for (const o of sc.ov){
    let e = null;
    if (o.t === 'marge'){ e = document.getElementById(o.id); const r = rel(document.getElementById(o.anchor), sec.querySelector('.contenu'));
      e.style.top = Math.round(r.y + (o.dy ?? -12)) + 'px'; }
    else if (o.t === 'hl'){ e = mk('g', {}, U);
      for (const id of o.ids){ const b = B(id), p = o.pad ?? 4, h = b.h + 2*p;
        mk('rect', {x:b.x - p - 5, y:b.y - p, width:b.w + 2*p + 10, height:h, rx:Math.min(h/2, 26), fill:o.col || '#CFE2F8', filter:'url(#flou)'}, e); } }
    else if (o.t === 'slash'){ const b = B(o.id);
      e = mk('line', {x1:b.x - 4, y1:b.y + b.h + 3, x2:b.x + b.w + 4, y2:b.y - 3, stroke:'#D62828', 'stroke-width':3.2, 'stroke-linecap':'round'}, O); }
    else if (o.t === 'oval'){ const b = B(o.id);
      e = mk('ellipse', {cx:b.x + b.w/2, cy:b.y + b.h/2, rx:b.w/2 + 9, ry:b.h/2 + 6, fill:'none', stroke:'#D62828', 'stroke-width':3}, O); }
    else if (o.t === 'darrow'){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O);
      const x0 = a.x + a.w + 10, y0 = a.y + a.h*.75, x1 = b.x + b.w*.4, y1 = b.y - 4;
      mk('path', {d:`M${x0},${y0} C${x0 + 60},${y0 + 10} ${x1 + 40},${y1 - 50} ${x1},${y1}`, fill:'none', stroke:'#D62828', 'stroke-width':2.6, 'stroke-dasharray':'9 6'}, e);
      head(e, x1, y1, Math.atan2(50, -40), '#D62828'); }
    else if (o.t === 'note'){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O);
      const x0 = a.x + Math.min(120, a.w*.45), y0 = a.y + 2, x1 = b.x + b.w/2, y1 = b.y + b.h + 3;
      mk('path', {d:`M${x0},${y0} C${x0 + 30},${y0 - 30} ${x1 - 30},${y1 + 34} ${x1},${y1}`, fill:'none', stroke:'#E2702A', 'stroke-width':2.4}, e);
      head(e, x1, y1, Math.atan2(-34, 30), '#E2702A'); }
    else if (o.t === 'uline' && false){ const b = B(sc.tid);
      e = mk('line', {x1:b.x + b.w*0.30, y1:b.y + b.h + 4, x2:b.x + b.w + 2, y2:b.y + b.h + 4, stroke:'#3B6FB6', 'stroke-width':3.5}, O); }
    else if (o.t === 'arc'){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O); const col = o.col || '#D62828';
      const x0 = a.x + a.w/2, x1 = b.x + b.w/2, y0 = Math.min(a.y, b.y) + 4, dx = x1 - x0, h = o.h ?? (18 + 0.10*Math.abs(dx));
      // la flèche se TRACE du facteur vers le terme (de gauche à droite), en ralentissant ; la pointe vient à la fin
      const tr = mk('path', {d:`M${x0},${y0} C${x0 + dx*0.12},${y0 - h} ${x1 - dx*0.12},${y0 - h} ${x1},${y0 - 2}`, fill:'none', stroke:col, 'stroke-width':2.6, 'stroke-linecap':'round', class:'trace'}, e);
      tr.style.setProperty('--L', tr.getTotalLength().toFixed(1));
      head(e, x1, y0 - 2, Math.atan2(h, dx*0.12), col); e.lastChild.setAttribute('class', 'pointe'); }
    else if (o.t === 'surl'){ e = mk('g', {}, U);            // surlignage doux : couleur transparente, bords estompés
      let bs = o.ids.map(B);
      if (o.union){ const x0 = Math.min(...bs.map(b => b.x)), y0 = Math.min(...bs.map(b => b.y)),
        x1 = Math.max(...bs.map(b => b.x + b.w)), y1 = Math.max(...bs.map(b => b.y + b.h)); bs = [{x:x0, y:y0, w:x1 - x0, h:y1 - y0}]; }
      for (const b of bs){ const p = o.pad ?? 3, h = b.h + 2*p;
        mk('rect', {x:b.x - p - 3, y:b.y - p, width:b.w + 2*p + 6, height:h, rx:Math.min(h/2, 14), fill:o.col,
          'fill-opacity':o.op ?? 0.30, filter:'url(#flou)'}, e); } }
    else if (o.t === 'lien' && Math.abs(B(o.from).y - B(o.to).y) < B(o.from).h){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O);
      // même ligne : arc bas AU-DESSUS de la ligne (il doit tenir entre deux lignes), de la fin du membre de gauche au
      // début de ce qui s'écrit, qui se trace ; l'étiquette juste avant le départ de l'arc
      const col = o.col || '#2F5FA8', x0 = a.x + a.w - 6, x1 = b.x + Math.min(64, b.w*0.3), y0 = Math.min(a.y, b.y) + 2, dx = x1 - x0, h = o.h ?? 20;
      const tr = mk('path', {d:`M${x0},${y0} C${x0 + dx*0.25},${y0 - h} ${x1 - dx*0.25},${y0 - h} ${x1},${y0 - 2}`, fill:'none', stroke:col,
        'stroke-width':2.4, 'stroke-linecap':'round', class:'trace'}, e);
      tr.style.setProperty('--L', tr.getTotalLength().toFixed(1));
      head(e, x1, y0 - 2, Math.atan2(h, dx*0.25), col); e.lastChild.setAttribute('class', 'pointe');
      const t = mk('text', {x:x0 - 4, y:y0 - 9, 'text-anchor':'end', 'font-size':o.fs || 15, 'font-weight':700, fill:col,
        'paint-order':'stroke', stroke:'#FFFFFF', 'stroke-width':4}, e); t.textContent = o.lab || ''; }
    else if (o.t === 'lien'){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O); const col = o.col || '#2F5FA8';
      // flèche d'une ligne à la suivante (identité remarquable…), qui se trace, avec son étiquette sur le côté
      const x0 = a.x + a.w/2, y0 = a.y + a.h + 1, x1 = b.x + b.w/2, y1 = b.y + 1, dx = o.dx ?? -44;
      const tr = mk('path', {d:`M${x0},${y0} C${x0 + dx},${y0 + 8} ${x1 + dx},${y1 - 8} ${x1},${y1}`, fill:'none', stroke:col,
        'stroke-width':2.4, 'stroke-linecap':'round', class:'trace'}, e);
      tr.style.setProperty('--L', tr.getTotalLength().toFixed(1));
      head(e, x1, y1, Math.atan2(8, -dx), col); e.lastChild.setAttribute('class', 'pointe');
      const ls = (o.lab || '').split('\n'), xl = dx < 0 ? Math.min(x0, x1) + dx - 4 : Math.max(x0, x1) + dx + 4;
      ls.forEach((l, j) => { const t = mk('text', {x:xl, y:(y0 + y1)/2 + 6 + 18*j - 9*(ls.length - 1), 'text-anchor':dx < 0 ? 'end' : 'start',
        'font-size':o.fs || 17, 'font-weight':700, fill:col, 'paint-order':'stroke', stroke:'#FFFFFF', 'stroke-width':4}, e); t.textContent = l; }); }
    else if (o.t === 'ratio'){ const a = B(o.from), b = B(o.to); e = mk('g', {}, O); const col = o.col || '#D62828';
      // ×N / ÷N d'une fraction à la suivante : flèche au-dessus (numérateurs) et au-dessous (dénominateurs), qui se tracent
      const xa = a.x + a.w*0.82, xb = b.x + b.w*0.62, dx = xb - xa;
      for (const haut of [true, false]){
        const y0 = haut ? Math.min(a.y, b.y) + 3 : Math.max(a.y + a.h, b.y + b.h) - 3, sg = haut ? -1 : 1;
        const tr = mk('path', {d:`M${xa},${y0} C${xa + dx*0.2},${y0 + 24*sg} ${xb - dx*0.2},${y0 + 24*sg} ${xb},${y0 + 2*sg}`, fill:'none',
          stroke:col, 'stroke-width':2.3, 'stroke-linecap':'round', class:'trace'}, e);
        tr.style.setProperty('--L', tr.getTotalLength().toFixed(1));
        head(e, xb, y0 + 2*sg, Math.atan2(-22*sg, dx*0.2), col); e.lastChild.setAttribute('class', 'pointe');
        const t = mk('text', {x:(xa + xb)/2, y:y0 + (haut ? -30 : 44), 'text-anchor':'middle', 'font-size':18, 'font-weight':700, fill:col,
          'paint-order':'stroke', stroke:'#FFFFFF', 'stroke-width':4}, e); t.textContent = o.lab; } }
    else if (o.t === 'cadre'){ const b = B(o.id);
      e = mk('rect', {x:b.x - 3, y:b.y - 3, width:b.w + 6, height:b.h + 6, rx:3, fill:'none', stroke:o.col || '#D62828', 'stroke-width':3.5}, O); }
    else if (o.t === 'xcross'){ const b = B(o.id); e = mk('g', {}, O);
      mk('line', {x1:b.x + 10, y1:b.y + 7, x2:b.x + b.w - 10, y2:b.y + b.h - 7, stroke:'#D62828', 'stroke-width':3}, e);
      mk('line', {x1:b.x + 10, y1:b.y + b.h - 7, x2:b.x + b.w - 10, y2:b.y + 7, stroke:'#D62828', 'stroke-width':3}, e); }
    if (e){ o.el = e; e.dataset.in = o.in; if (o.out != null) e.dataset.out = o.out; }
  }
  lignesBase(sec);
  sec.dataset.ok = '1';
}

// marques dans la fiche Énoncé (dual.py) : cadres et soulignements, chacun visible de son étape d'entrée à sa sortie
function marquesEnonce(sc){ const z = document.getElementById('marquesEnonce'); if (!z) return; z.innerHTML = '';
  const k = 596 / ITEMS.w;
  for (const o of sc.fs || []){ if (!(step >= o.in && (o.out == null || step < o.out))) continue;
    const [x0, y0, x1, y1] = o.box, d = document.createElement('div');
    if (o.kind === 'rect') Object.assign(d.style, {position:'absolute', left:(x0*k - 3) + 'px', top:(y0*k - 3) + 'px',

   1. surimpression 'fl' : flèche qui se trace d'un terme vers sa nouvelle place (égalité transformée) ;
   2. VOLET à droite de la page (.tiroir) : copie de l'arbre (chemins tracés) et animation de l'expérience aléatoire ;
      il s'ouvre et se ferme aux clics voulus (repères .tir-m), se rouvre à la main par sa poignée ;

/* ---------------------------------------------------------------- 1. flèches 'fl' */

  if (a === 'tr') return [b.x + b.w*0.75, b.y - 3, 0, -1];
  if (a === 'bl') return [b.x + b.w*0.25, b.y + b.h + 3, 0, 1];

  const tr = mk('path', {d:`M${x0},${y0} C${c0x},${c0y} ${c1x},${c1y} ${x1},${y1}`, fill:'none', stroke:col,
    'stroke-width':o.w || 2.8, 'stroke-linecap':'round', class:'trace'}, e);

/* ---- la feuille se resserre (zoom) quand le volet est ouvert : rien de ce qui s'écrit pendant ce temps ne passe

function xpPreparer(v){
  if (v.xp) return;

  v.xp = {cfg, svg:v.querySelector('.xp-svg'), gen:0, etat:null, res:[], occupe:false};
  v.querySelector('.xp-go').onclick = () => { manuel(); xpJouer(v, false); };
  v.querySelector('.xp-pas').onclick = () => { manuel(); xpPas(v); };
  v.querySelector('.xp-raz').onclick = () => { manuel(); xpRaz(v); };
  xpRaz(v);
}
function xpRaz(v){
  const x = v.xp; x.gen++; x.occupe = false; x.svg.innerHTML = ''; x.res = [];
  x.etat = XP[x.cfg.type].dessiner(x.svg, x.cfg, x); x.etat.fini = false; xpRes(v);

  const x = v.xp; if (x.occupe) return;
  if (x.etat.fini) xpRaz(v);
  x.occupe = true; const g = x.gen;
  const r = await XP[x.cfg.type].pas(x.etat, x, g);
  if (g !== x.gen) return;
  x.occupe = false;
  if (r) x.res.push(r);

}

  xpPreparer(v); xpRaz(v);
  const x = v.xp, g = x.gen;
  await xpAttendre(auto ? 700 : 200);
  while (g === x.gen && !x.etat.fini){ await xpPas(v); if (g !== x.gen) return; await xpAttendre(550); }
}

XP.urne = {

    for (let k = tous.length - 1; k > 0; k--){ const j = Math.floor(Math.random()*(k + 1)); [tous[k], tous[j]] = [tous[j], tous[k]]; }
    const N = tous.length, r = cfg.r || (N <= 6 ? 22 : N <= 12 ? 18 : N <= 24 ? 14 : N <= 50 ? 10.5 : 7.5);
    const cols = Math.max(1, Math.floor((z.x1 - z.x0)/(2*r + 5))), rows = Math.ceil(N/cols);

    mk('circle', {cx:lx, cy:ly + 19, r:7, fill:'#C3CCD6'}, svg); mk('circle', {cx:lx, cy:ly + 19, r:10, fill:'none', stroke:'#F28C28', 'stroke-width':3}, svg);

    const fr = (a, b) => `${a}/${b}` + (k !== 1 ? ` = ${a*k}/${b*k}` : '');
    st.et++;
    if (mode === 'inter'){
      if (st.et === 1){ for (const p of st.pts){ p.d.setAttribute('fill', '#8C99A8'); } await xpAttendre(350); for (const p of st.pts) p.d.setAttribute('fill', '#C3CCD6');

        return `${c.A.lab} (${c.A.nom}) : <b>${c.nA}</b> points bleus`; }

        return `${c.B.lab} (${c.B.nom}) : <b>${c.nB}</b> points cerclés, dont <b>${c.nAB}</b> déjà comptés dans ${c.A.lab}`; }
      await xpTw(600, t => st.pts.forEach(p => { if (!(p.a || p.b)){ p.d.setAttribute('opacity', 1 - 0.8*t); } else p.t.setAttribute('opacity', t); }), x, g);
      const U = c.nA + c.nB - c.nAB, IU = c.union || `${c.A.lab} ∪ ${c.B.lab}`;
      st.fini = true; st.gros.textContent = `P(${IU}) = ${U}/${c.N}`;
      st.bilan = `<b>P(${IU})</b> = (${c.nA} + ${c.nB} − ${c.nAB})/${c.N} = ${U}/${c.N} : on compte ${c.A.lab}, on ajoute ${c.B.lab}, `
        + `on retire ${I}, compté deux fois.` + (c.approx ? ` ${c.approx}` : '');
      return `${IU} : dans ${c.A.lab} <b>ou</b> dans ${c.B.lab} : <b>${U}</b> points`;
    }
    if (mode === 'cond'){
      if (st.et === 1){ await xpTw(650, t => st.pts.forEach(p => { if (p.a) p.t.setAttribute('opacity', t); else { p.d.setAttribute('opacity', 1 - 0.85*t); p.an.setAttribute('opacity', p.b ? 1 - 0.85*t : 0); } }), x, g);
        st.gros.textContent = `nouvel univers : ${c.A.lab} (${c.nA} points)`;
        return `On sait que <b>${c.A.lab}</b> est réalisé : l’univers se réduit à ${c.A.lab}, soit <b>${c.nA}</b> points`; }
      await xpTw(600, t => st.pts.forEach(p => { if (p.a && !p.b) p.d.setAttribute('opacity', 1 - 0.6*t); }), x, g);
      st.fini = true; st.gros.innerHTML = `P<tspan dy="7" font-size="17">${c.A.lab}</tspan><tspan dy="-7">(${c.B.lab}) = ${c.nAB}/${c.nA}</tspan>`;
      st.bilan = `<b>P<sub>${c.A.lab}</sub>(${c.B.lab})</b> = ${fr(c.nAB, c.nA)} : la part de ${c.B.lab} <b>dans ${c.A.lab}</b>, `
        + `et non dans tout l’univers (comparer avec P(${I}) = ${c.nAB}/${c.N}).` + (c.approx ? ` ${c.approx}` : '');
      return `Parmi ces ${c.nA} points, <b>${c.nAB}</b> sont aussi dans ${c.B.lab}`;
    }
    if (st.et === 1){ await xpTw(650, t => st.pts.forEach(p => { if (p.a) p.t.setAttribute('opacity', t); }), x, g);
      st.gros.textContent = `P(${c.A.lab}) = ${c.nA}/${c.N}`;
      return `<b>P(${c.A.lab})</b> = ${fr(c.nA, c.N)} : la part de ${c.A.lab} dans Ω`; }
    if (st.et === 2){ await xpTw(600, t => st.pts.forEach(p => { if (!(p.a && p.b)){ p.d.setAttribute('opacity', 1 - 0.75*t); p.an.setAttribute('opacity', p.b ? 1 - 0.75*t : 0); } }), x, g);
      st.gros.innerHTML = `P<tspan dy="7" font-size="17">${c.A.lab}</tspan><tspan dy="-7">(${c.B.lab}) = ${c.nAB}/${c.nA}</tspan>`;
      return `<b>P<sub>${c.A.lab}</sub>(${c.B.lab})</b> = ${fr(c.nAB, c.nA)} : la part de ${c.B.lab} dans ${c.A.lab}` + (c.approx ? ` ${c.approx}` : ''); }
    st.fini = true; st.gros.textContent = `${c.nA}/${c.N} × ${c.nAB}/${c.nA} = ${c.nAB}/${c.N}`;
    st.bilan = `<b>P(${I}) = P(${c.A.lab}) × P<sub>${c.A.lab}</sub>(${c.B.lab})</b> : on prend la part de ${c.A.lab} dans Ω, puis la `
      + `part de ${c.B.lab} dans ${c.A.lab} : ${c.nA}/${c.N} × ${c.nAB}/${c.nA} = ${c.nAB}/${c.N}.`;
    return `P(${I}) = ${c.nA}/${c.N} × ${c.nAB}/${c.nA} = <b>${c.nAB}/${c.N}</b>`;
  }
};

/* ---- urne puis dé (exemple 14) : jeton blanc -> dé cubique ; jeton noir -> dé tétraédrique */
XP.urnede = {
  dessiner(svg, cfg){
    const st = {cfg, etape:0};
    st.c = {x:240, y:300}; mk('circle', {cx:240, cy:300, r:27, fill:'#F4F7FB', stroke:'#9AA9BB', 'stroke-width':2, 'stroke-dasharray':'5 4'}, svg);
    xpTexte(svg, 240, 346, 'jeton tiré', {'font-size':14, fill:'#5B6878'});
    const gU = mk('g', {transform:'translate(-6,8) scale(0.72)'}, svg);
    st.u = XP.urne.dessiner(gU, Object.assign({}, cfg.urne, {tirages:0}));
    st.gU = gU;
    st.d6 = mk('g', {}, svg); xpPose(st.d6, 400, 90); xpFaceDe(st.d6, 6, 1, 84);
    st.d4 = mk('g', {}, svg); xpPose(st.d4, 400, 250); xpFaceDe(st.d4, 4, 1, 84);
    xpTexte(svg, 400, 156, 'dé cubique', {'font-size':14, fill:'#5B6878'}); xpTexte(svg, 400, 318, 'dé tétraédrique', {'font-size':14, fill:'#5B6878'});
    return st;
  },
  async pas(st, x, g){
    const cfg = st.cfg;

      const u = st.u, j = u.jetons[Math.floor(Math.random()*u.jetons.length)];
      j.g.parentNode.appendChild(j.g); const b = u.bouche, cx = (st.c.x + 6)/0.72, cy = (st.c.y - 8)/0.72;
      if (!await xpTw(420, t => xpPose(j.g, xpLerp(j.x, b.x, t), xpLerp(j.y, b.y, t), xpLerp(1, 1.4, t)), x, g)) return null;
      if (!await xpTw(560, t => xpPose(j.g, xpLerp(b.x, cx, t), xpLerp(b.y, cy, t) - 40*Math.sin(Math.PI*t), 1.4), x, g)) return null;
      st.jeton = j.gr; st.etape = 1;
      const autre = j.gr.de === 6 ? st.d4 : st.d6; autre.setAttribute('opacity', 0.3);
      return 'Jeton tiré : <b>' + j.gr.nom + '</b>';
    }
    const f = st.jeton.de, d = f === 6 ? st.d6 : st.d4, Y = f === 6 ? 90 : 250, v = 1 + Math.floor(Math.random()*f);
    const t0 = performance.now();
    while (performance.now() - t0 < 1000){ if (x.gen !== g) return null; xpFaceDe(d, f, 1 + Math.floor(Math.random()*f), 84);
      xpPose(d, 400 + (Math.random() - .5)*12, Y + (Math.random() - .5)*12, 1, (Math.random() - .5)*36); await xpAttendre(75); }
    xpFaceDe(d, f, v, 84); xpPose(d, 400, Y);
    st.fini = true; st.bilan = v === 1 ? '<b style="color:#2E7D32">numéro 1 : le joueur gagne</b>' : '<b style="color:#C62828">pas de 1 : le joueur perd</b>';
    return (f === 6 ? 'Dé cubique' : 'Dé tétraédrique') + ' : <b>' + v + '</b>';
  }
};

/* ---- carré unité : Ω en 10 x 10 cases, partagé en colonnes (cfg.cols : A₁ | A₂ | …, largeurs p) puis, dans chaque colonne,
        B en bas (hauteur b) | B̅ en haut ; parties « iB » et « iBb » (i : numéro de colonne) ; ensembles « ci », « B », « Bb » */
XP.carre = {
  pal:[['#2F7FD6', '#A9CBF2', '#1E5FA8'], ['#E8892C', '#F6CFA4', '#B85E0A'], ['#B0307A', '#EDB8D6', '#8E1F5E'], ['#2E9E4F', '#B5E3C2', '#1F7A3A']],
  col(c, k){ const i = +k[0], P = c.cols[i].pal || XP.carre.pal[i % 4]; return k.endsWith('Bb') ? P[1] : P[0]; },
  ensemble(c, k){ const r = []; c.cols.forEach((x, i) => { if (k === 'c' + i) r.push(i + 'B', i + 'Bb'); if (k === 'B') r.push(i + 'B'); if (k === 'Bb') r.push(i + 'Bb'); }); return r; },
  obj(c, k){ return k[0] === 'c' ? c.cols[+k.slice(1)] : c[k]; },
  nom(c, k){ return [c.cols[+k[0]], k.endsWith('Bb') ? c.Bb : c.B]; },
  fr(v){ const r = Math.round(v*10000)/10000; return (Math.abs(r - v) > 1e-9 ? '≈ ' : '= ') + String(r).replace('.', ','); },
  nb(v){ return v.toLocaleString('fr-FR'); },
  dessiner(svg, cfg){
    const st = {cfg, et:0, R:{}, geo:{}}, N = cfg.N, S = 230, x0 = 34, y0 = 34, E = XP.carre, n = {}, cs = cfg.cols;
    let x = x0;
    cs.forEach((c, i) => { const w = c.p*S, h = (1 - c.b)*S;
      n[i + 'B'] = Math.round(N*c.p*c.b); n[i + 'Bb'] = Math.round(N*c.p*(1 - c.b)); n['c' + i] = n[i + 'B'] + n[i + 'Bb'];
      st.geo[i + 'B'] = [x, y0 + h, w, S - h]; st.geo[i + 'Bb'] = [x, y0, w, h]; c._x = x; c._w = w; c._h = h; x += w; });
    n.B = cs.reduce((s, c, i) => s + n[i + 'B'], 0); n.Bb = N - n.B; st.n = n;
    st.fond = mk('rect', {x:x0, y:y0, width:S, height:S, fill:'#C9D2DC', opacity:0}, svg);
    for (const k in st.geo){ const [a, b, w, h] = st.geo[k]; st.R[k] = mk('rect', {x:a, y:b, width:w, height:h, fill:E.col(cfg, k), opacity:0}, svg); }
    const gr = mk('g', {stroke:'#FFFFFF', 'stroke-width':1.2, opacity:0.9}, svg);
    for (let i = 1; i < 10; i++){ mk('line', {x1:x0 + i*S/10, y1:y0, x2:x0 + i*S/10, y2:y0 + S}, gr); mk('line', {x1:x0, y1:y0 + i*S/10, x2:x0 + S, y2:y0 + i*S/10}, gr); }
    mk('rect', {x:x0, y:y0, width:S, height:S, fill:'none', stroke:'#17233A', 'stroke-width':2}, svg);
    st.sep = mk('g', {stroke:'#17233A', 'stroke-width':2.4, opacity:0}, svg);
    st.sepB = mk('g', {stroke:'#17233A', 'stroke-width':1.8, 'stroke-dasharray':'5 3', opacity:0}, svg);
    cs.forEach((c, i) => { if (i) mk('line', {x1:c._x, y1:y0, x2:c._x, y2:y0 + S}, st.sep); mk('line', {x1:c._x, y1:y0 + c._h, x2:c._x + c._w, y2:y0 + c._h}, st.sepB); });
    st.out = mk('g', {fill:'none', stroke:'#D62828', 'stroke-width':3.5, opacity:0}, svg);
    xpTexte(svg, x0 + S/2, y0 - 12, `Ω : ${E.nb(N)} ${cfg.qui}`, {'font-size':15, 'font-weight':700, fill:'#17233A'});
    st.labA = mk('g', {opacity:0}, svg);
    let xg = -1e9, bas = 0;                            // colonnes étroites voisines : étiquettes sur deux rangées
    cs.forEach((c, i) => { const P = c.pal || E.pal[i % 4], fs = c._w < 70 ? 12 : 14, xc = c._x + c._w/2;
      bas = (xc - xg < 46 && !bas) ? 34 : 0; xg = xc;
      xpTexte(st.labA, xc, y0 + S + 18 + bas, c.lab, {'font-size':fs + 1, 'font-weight':700, fill:P[2]});
      xpTexte(st.labA, xc, y0 + S + 34 + bas, E.nb(n['c' + i]), {'font-size':fs, fill:P[2]}); });
    st.leg = mk('g', {opacity:0}, svg);                 // légende : les parties et leurs effectifs
    const lx = x0 + S + 20; let ly = y0 + 14; const pas = cs.length > 2 ? 26 : 30;
    cs.forEach((c, i) => { for (const [k, e] of [[i + 'Bb', cfg.Bb], [i + 'B', cfg.B]]){
      mk('rect', {x:lx, y:ly - 12, width:16, height:16, rx:3, fill:E.col(cfg, k)}, st.leg);
      xpTexte(st.leg, lx + 24, ly + 1, `${c.lab} ∩ ${e.lab} : ${E.nb(n[k])}`, {'text-anchor':'start', 'font-size':14.5, fill:'#17233A'}); ly += pas; } });
    xpTexte(st.leg, lx, ly + 4, `1 case = ${E.nb(N/100)} ${cfg.qui}`, {'text-anchor':'start', 'font-size':12.5, fill:'#5B6878'});
    st.loupe = mk('g', {}, svg);
    st.gros = xpTexte(svg, 240, 380, '', {'font-size':cs.length > 2 ? 19 : 22, 'font-weight':700, fill:'#17233A'});
    return st;
  },
  async tout(st, x, g){                               // Ω et toutes ses parties
    await xpTw(500, t => { for (const k in st.R) st.R[k].setAttribute('opacity', t); for (const e of [st.sep, st.sepB, st.labA, st.leg]) e.setAttribute('opacity', t); }, x, g);
  },
  contour(st, ks){ st.out.innerHTML = ''; for (const k of ks){ const [x, y, w, h] = st.geo[k]; mk('rect', {x, y, width:w, height:h}, st.out); } st.out.setAttribute('opacity', ks.length ? 1 : 0); },
  async voir(st, ks, x, g, bas){                      // seules les parties ks restent vives (les autres à « bas »)
    const o0 = {}; for (const k in st.R) o0[k] = +st.R[k].getAttribute('opacity');
    await xpTw(550, t => { for (const k in st.R) st.R[k].setAttribute('opacity', xpLerp(o0[k], ks.includes(k) ? 1 : (bas ?? 0.15), t)); }, x, g);
    XP.carre.contour(st, ks);
  },
  loupe(st, ks, c, lab){                              // une bande mince agrandie : une case par individu, une ligne par partie
    const L = st.loupe; L.innerHTML = ''; const tot = ks.reduce((s, k) => s + st.n[k], 0), mx = Math.max(...ks.map(k => st.n[k]));
    const w = Math.min(12, 380/mx), xl = 240 - mx*w/2 + 28, yl = 322; st.cases = {};
    xpTexte(L, 240, yl - 7, `à la loupe : les ${tot} ${c.qui} de ${lab}, 1 case = 1 ${c.qui1}`, {'font-size':13, fill:'#5B6878'});
    ks.forEach((k, r) => { st.cases[k] = []; const [X1] = XP.carre.nom(c, k), y = yl + r*(w + 5), P = c.cols[+k[0]].pal || XP.carre.pal[+k[0] % 4];
      xpTexte(L, xl - 8, y + w - 1, `${X1.lab} : ${st.n[k]}`, {'text-anchor':'end', 'font-size':13, 'font-weight':700, fill:P[2]});
      for (let j = 0; j < st.n[k]; j++) st.cases[k].push(mk('rect', {x:xl + j*w + 0.5, y, width:w - 1.5, height:w, rx:1.5, fill:P[0], opacity:0}, L)); });
    return tot;
  },
  async pas(st, x, g){
    const c = st.cfg, n = st.n, mode = c.mode, E = XP.carre, cs = c.cols, Nt = E.nb(c.N); st.et++;
    const sub = (P, G, T) => `${P}<tspan dy="7" font-size="15">${G}</tspan><tspan dy="-7">(${T})</tspan>`;
    if (mode === 'omega'){
      if (st.et === 1){ await xpTw(600, t => st.fond.setAttribute('opacity', t), x, g);
        return `Ω : l’ensemble des <b>${Nt}</b> ${c.qui} (un carré de 100 cases, 1 case = ${E.nb(c.N/100)} ${c.qui})`; }
      if (st.et === 2){ for (const k in st.R) st.R[k].setAttribute('fill', E.pal[+k[0] % 4][1]);
        cs.forEach((cc, i) => { if (cc.pal) for (const k of [i + 'B', i + 'Bb']) st.R[k].setAttribute('fill', cc.pal[1]); });
        await xpTw(700, t => { for (const k in st.R) st.R[k].setAttribute('opacity', t); st.sep.setAttribute('opacity', t); st.labA.setAttribute('opacity', t); }, x, g);
        return cs.map((cc, i) => `${cc.lab} : <b>${E.nb(n['c' + i])}</b> ${c.qui} ${cc.de}`).join(' ; '); }
      for (const k in st.R) st.R[k].setAttribute('fill', E.col(c, k));
      await xpTw(700, t => { st.sepB.setAttribute('opacity', t); st.leg.setAttribute('opacity', t); }, x, g);
      st.fini = true; st.gros.textContent = Object.keys(st.geo).map(k => E.nb(n[k])).join(' + ') + ` = ${Nt}`;
      st.bilan = `Ω est partagé en ${2*cs.length} parties : ` + Object.keys(st.geo).map(k => { const [a, b] = E.nom(c, k); return `${a.lab} ∩ ${b.lab} (${E.nb(n[k])})`; }).join(', ') + '.';
      return cs.map((cc, i) => `dans ${cc.lab} : <b>${E.nb(n[i + 'B'])}</b> ${c.B.phr}, ${E.nb(n[i + 'Bb'])} ${c.Bb.phr}`).join(' ; ');
    }
    if (st.et === 1){ await E.tout(st, x, g); return `Ω : les <b>${Nt}</b> ${c.qui} et leurs ${2*cs.length} parties`; }
    if (mode === 'zone'){                              // étapes données : parties mises en avant, message, grand texte
      const e = c.etapes[st.et - 2]; await E.voir(st, e.z, x, g);
      if (e.g) st.gros.textContent = e.g;
      if (st.et - 1 >= c.etapes.length){ st.fini = true; st.bilan = c.bilan || ''; }
      return e.m;
    }
    const Gk = c.donne, G = E.obj(c, Gk), Gs = E.ensemble(c, Gk), nG = n[Gk], T = c.cible;
    if (st.et === 2){
      await E.voir(st, Gs, x, g);
      if (mode === 'produit'){ st.gros.textContent = `P(${G.lab}) = ${E.nb(nG)}/${Nt} ${E.fr(nG/c.N)}`;
        return `<b>P(${G.lab})</b> = ${E.nb(nG)}/${Nt} ${E.fr(nG/c.N)} : la part de ${G.lab} dans Ω`; }
      let m = `On sait que <b>${G.lab}</b> est réalisé (${G.nom}) : l’univers se réduit à ${G.lab}, soit <b>${E.nb(nG)}</b> ${c.qui}`;
      if (nG < 0.2*c.N && Gs.every(k => n[k] <= 60)){ E.loupe(st, Gs, c, G.lab);
        await xpTw(700, t => { for (const k of Gs) st.cases[k].forEach((r, j) => r.setAttribute('opacity', Math.min(1, Math.max(0, t*1.4 - j/st.cases[k].length*0.4)))); }, x, g);
        m += ` — à la loupe : une case par ${c.qui1}`; }
      st.gros.textContent = `nouvel univers : ${G.lab} (${E.nb(nG)} ${c.qui})`;
      return m;
    }
    const [X1, X2] = E.nom(c, T), autre = X1 === G ? X2 : X1, nT = n[T];
    await xpTw(600, t => { for (const k of Gs) if (k !== T) st.R[k].setAttribute('opacity', 1 - 0.7*t);
      if (st.cases) for (const k of Gs) if (k !== T) st.cases[k].forEach(r => r.setAttribute('opacity', 1 - 0.75*t)); }, x, g);
    E.contour(st, [T]);
    st.fini = true;
    if (mode === 'produit'){
      const v = s => String(Math.round(s*10000)/10000).replace('.', ','), cc = cs[+T[0]];
      st.gros.textContent = `P(${X1.lab} ∩ ${X2.lab}) = ${v(cc.p)} × ${v(T.endsWith('Bb') ? 1 - cc.b : cc.b)} = ${v(nT/c.N)}`;
      st.bilan = `<b>P(${X1.lab} ∩ ${X2.lab}) = P(${G.lab}) × P<sub>${G.lab}</sub>(${autre.lab})</b> : on prend la part de ${G.lab} dans Ω, puis la part de `
        + `${autre.lab} dans ${G.lab} : il reste ${E.nb(nT)} ${c.qui} sur ${Nt}.` + (c.fin ? ' ' + c.fin : '');
      return `<b>P<sub>${G.lab}</sub>(${autre.lab})</b> = ${E.nb(nT)}/${E.nb(nG)} ${E.fr(nT/nG)} : la part de ${autre.lab} dans ${G.lab}`;
