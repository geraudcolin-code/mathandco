:root{--encre:#17233A;--gris:#6B7483;--trait:#C9D3DE;--papier:#FFFFFF;--courbe:#1F5FAF;--rouge:#D62828;
  --vert:#2E7D32;--orange:#E2702A;--fond:#F4F6FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fond);color:var(--encre);font-family:'Lex',Lexend,'Segoe UI',Verdana,sans-serif;
  overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:baseline;gap:13px;padding:8px 18px 7px;background:var(--papier);
  border-bottom:1px solid var(--trait)}
header h1{font-size:20px;margin:0;font-weight:700}
header .st{font-size:14px;color:var(--gris)}
main{flex:1;display:flex;gap:14px;padding:12px 16px;min-height:0;overflow:hidden}
#scene{flex:1;min-width:0;background:var(--papier);border:1px solid var(--trait);border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:5px}
#fig{width:100%;height:100%}
#cote{flex:0 0 408px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
.carte{background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:8px 12px;flex:0 0 auto}
.carte h2{font-size:12.5px;margin:0 0 7px;color:var(--gris);font-weight:700;letter-spacing:.04em;
  text-transform:uppercase}
.lig{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lig + .lig{margin-top:7px}
button{font:inherit;color:inherit;background:var(--papier);border:1.5px solid var(--trait);border-radius:7px;
  padding:5px 10px;font-size:14.5px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#9DB2CB}
button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
button.gros{font-size:16px;padding:6px 13px;font-weight:700}
input[type=range]{flex:1;min-width:110px;-webkit-appearance:none;appearance:none;background:none;height:22px;
  cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#B9C6D6}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#B9C6D6}

function demarrer(DATA){
/* ====================================================================================================
   vif.js — le cœur commun des FIGURES VIVES du site Colinéaire (atelier : moteur/poly/vif.js)

   Une figure vive est un vrai repère dessiné en SVG — jamais une capture du poly — où tout se manipule :
   on attrape le point A ou le point H à la souris (ou au doigt sur le tableau interactif), on fait varier
   l'écart h, la corde (AH) suit, son coefficient directeur se recalcule, et la tangente apparaît en
   position limite. Le même fichier sert :
     • à l'animation libre « La corde devient tangente » (panneau complet à droite) ;
     • aux figures vives posées DANS le poly à trous animé (barre compacte, voir vif_poly.js).

   Conventions de la maison (charte) : quadrillage à deux niveaux façon GeoGebra, courbe bleue,
   corde rouge, tangente verte en tirets, triangle de pente EN TIRETS avec ses deux mesures signées.

   VIF.creer(hote, spec) -> objet de pilotage. hote = un <svg>. spec = {fns, i, compact, montrer}.
   ==================================================================================================== */
window.VIF = (function () {
  'use strict';
  const SVG = 'http://www.w3.org/2000/svg';
  const C = {grille: ['#EEF3F9', '#D9E3EF'], encre: '#17233A', courbe: '#1F5FAF', rouge: '#D62828',
             vert: '#2E7D32', orange: '#E2702A'};
  const HMIN = 1e-5, HMAX = 10;

  const mk = (n, at, p) => { const e = document.createElementNS(SVG, n);
    for (const k in at) e.setAttribute(k, at[k]); if (p) p.appendChild(e); return e; };

  /* ---------------------------------------------- nombres à la française */
  function nb(v, dec){
    if (!isFinite(v)) return '—';
    return (+v.toFixed(dec === undefined ? 4 : dec)).toString().replace('.', ',').replace('-', '−');
  }
  const nbh = v => nb(v, 7);
  const sig = (v, n) => { if (!v) return 0; const e = Math.ceil(Math.log10(Math.abs(v)));
    const f = 10 ** (n - e); return Math.round(v * f) / f; };
  const pasJoli = e => { const p = 10 ** Math.floor(Math.log10(e)), m = e / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };

  function creer(hote, spec){
    const FN = spec.fns;
    let F = FN[spec.i || 0], a = F.a, h = F.h0 === undefined ? 1 : F.h0;
    let tan = true, tri = true, trace = false, zoom = false, entier = !!spec.entier;
    let anim = null, cordes = [], prise = null, VUE = null, ecoute = [];
    const m = spec.montrer || {};
    if (m.tangente === false) tan = false;
    if (m.triangle === false) tri = false;

    hote.setAttribute('viewBox', '0 0 ' + (spec.W || 980) + ' ' + (spec.H || 660));

      }
      return w;
    }

    /* ---------------------------------------------- le tracé */
    function dessiner(){
      hote.innerHTML = '';
      const [x0, x1, y0, y1] = fenetre();
      const Wp = spec.W || 980, Hp = spec.H || 660, L = 14, T = 14;
      const pw = Wp - 28, ph = Hp - 28;
      const X = x => L + (x - x0) / (x1 - x0) * pw, Y = y => T + (y1 - y) / (y1 - y0) * ph;
      VUE = {xDe: u => x0 + (u - L) / pw * (x1 - x0)};

      const halo = t => { t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke', '#fff');
        t.setAttribute('stroke-width', '3.6'); return t; };
      const fs = spec.fs || 1;                      /* facteur de taille des étiquettes (figures compactes) */

      for (const [st, col, wd] of [[sous(sx), C.grille[0], 1], [sx, C.grille[1], 1.2]])
        for (let k = Math.ceil(x0 / st - 1e-9); k * st <= x1 + 1e-9; k++)
          mk('line', {x1:X(k*st), y1:T, x2:X(k*st), y2:T+ph, stroke:col, 'stroke-width':wd}, g);
      for (const [st, col, wd] of [[sous(sy), C.grille[0], 1], [sy, C.grille[1], 1.2]])
        for (let k = Math.ceil(y0 / st - 1e-9); k * st <= y1 + 1e-9; k++)
          mk('line', {x1:L, y1:Y(k*st), x2:L+pw, y2:Y(k*st), stroke:col, 'stroke-width':wd}, g);

      const xv = X(0) > L + 2 && X(0) < L + pw - 2, yv = Y(0) > T + 2 && Y(0) < T + ph - 2;
      const xa = Math.min(Math.max(X(0), L + 1), L + pw - 1), ya = Math.min(Math.max(Y(0), T + 1), T + ph - 1);
      mk('line', {x1:L, y1:ya, x2:L+pw, y2:ya, stroke:C.encre, 'stroke-width':1.8}, g);
      mk('line', {x1:xa, y1:T+ph, x2:xa, y2:T, stroke:C.encre, 'stroke-width':1.8}, g);
      if (yv) mk('path', {d:`M${L+pw} ${ya} l-11 -5 l0 10 z`, fill:C.encre}, g);
      if (xv) mk('path', {d:`M${xa} ${T} l-5 11 l10 0 z`, fill:C.encre}, g);
      for (let k = Math.ceil(x0/sx - 1e-9); k*sx <= x1 + 1e-9; k++){

        const t = mk('text', {x:X(k*sx), y:(yv ? ya + 17*fs : T + ph - 7), 'text-anchor':'middle',
          'font-size':13*fs, fill:C.encre}, g);
        t.textContent = nb(k*sx, 7); halo(t);
      }
      for (let k = Math.ceil(y0/sy - 1e-9); k*sy <= y1 + 1e-9; k++){
        if (yv && Math.abs(k*sy) < 1e-9) continue;
        const t = mk('text', {x:(xv ? xa - 7 : L + 6), y:Y(k*sy) - 5, 'text-anchor':xv ? 'end' : 'start',

        if (tri && Math.abs(X(xh) - X(a)) > 24){

            mk('line', {x1:x1_, y1:y1_, x2:x2_, y2:y2_, stroke:C.orange, 'stroke-width':2.4*fs,
              'stroke-dasharray':'7 5'}, g);
          const t1 = mk('text', {x:(X(a)+X(xh))/2, y:Y(fa) + (fh > fa ? 20 : -10)*fs, 'text-anchor':'middle',
            'font-size':15*fs, 'font-weight':700, fill:C.orange}, g);
          t1.textContent = 'h = ' + nbh(h); halo(t1);
          if (Math.abs(Y(fh) - Y(fa)) > 22){
            const t2 = mk('text', {x:X(xh) + (h > 0 ? 10 : -10)*fs, y:(Y(fa)+Y(fh))/2 + 5*fs,
              'text-anchor':h > 0 ? 'start' : 'end', 'font-size':15*fs, 'font-weight':700, fill:C.orange}, g);
            t2.textContent = nb(fh - fa, 5); halo(t2);
          }
        }
        pt(X(xh), Y(fh), 'H', C.rouge, (h > 0 ? 11 : -11)*fs, (fh < fa ? 22 : -12)*fs);
      }
      pt(X(a), Y(fa), 'A', C.encre, (h > 0 ? -11 : 11)*fs, -12*fs);
      if (spec.badge !== false) badge(g, Wp, p);

      function pt(cx, cy, nom, col, dx, dy){
        mk('circle', {cx, cy, r:17, fill:'transparent', class:'poignee', 'data-pt':nom}, g);
        mk('circle', {cx, cy, r:6*fs, fill:col, class:'poignee', 'data-pt':nom}, g);
        const t = mk('text', {x:cx + dx, y:cy + dy, 'text-anchor':dx < 0 ? 'end' : 'start',
          'font-size':17*fs, 'font-weight':700, fill:col}, g);
        t.textContent = nom; halo(t);
      }
      function badge(g, Wp, p){            /* le coefficient directeur, en haut à droite de la figure */
        const txt = 'Γ(h) = ' + nb(p, 6), w = txt.length * 9.2 * fs + 18 * fs;
        mk('rect', {x:Wp - 18 - w, y:16, width:w, height:27*fs, rx:7, fill:'#fff', stroke:'#C9D3DE'}, g);
        const t = mk('text', {x:Wp - 18 - w / 2, y:35*fs, 'text-anchor':'middle', 'font-size':16*fs,
          'font-weight':700, fill:C.rouge}, g);
        t.textContent = txt;
      }
    }

    /* ---------------------------------------------- pilotage */
    function prevenir(){ for (const f of ecoute) f(etat()); }
    function etat(){
      const fa = F.f(a);
      return {F, a, h, tan, tri, trace, zoom, entier, anime: !!anim,
              gamma: (F.f(a + h) - fa) / h, derivee: F.d(a)};
    }
    function poserH(x){
      const s = x < 0 ? -1 : 1;
      h = sig(s * Math.min(HMAX, Math.max(HMIN, Math.abs(x))), 3);
      dessiner(); prevenir(); return h;
    }
    function poserA(x){
      let v = entier ? Math.round(x) : Math.round(x * 100) / 100;
      const w = F.win, b = (w[1] - w[0]) / 40;
      v = Math.min(w[1] - b, Math.max(w[0] + b, v));
      if (F.evite !== undefined && Math.abs(v - F.evite) < 0.35) v = F.evite + (v < F.evite ? -0.35 : 0.35);

async function dechiffrer(mdp){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name:'PBKDF2', salt:octets(P.s), iterations:P.n, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);

  return JSON.parse(new TextDecoder().decode(clair));
}
