<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[1ère]CH09_Resume_Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
/* Mise en page : page bleu nuit unie (un seul thème, voulu) ; la figure sur un écran bleu plus clair, face à un fil d'étapes sans cadres. */
:root{
  --bg:#121a3f; --ink:#eef1ff; --muted:#a9b3dc; --line:#2b3770; --soft:#1a2453; --card:rgba(255,255,255,.06);
  --u:#8cc8ff; --v:#ffb966; --sum:#ff8aa6; --diff:#6ff2bd; --proj:#d2b6ff;
  --accent:#ffd166; --accent-ink:#121a3f; --hl:rgba(255,209,102,.25);
  --good:#6ff2bd; --bad:#ff8aa6;
  --f-disp:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-ui:"Figtree", system-ui, sans-serif;
  --f-math:"STIX Two Text", "Times New Roman", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16.5px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto}
header.top{padding-block:36px 8px;display:grid;gap:6px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{font-family:var(--f-disp);font-size:clamp(30px,5vw,54px);line-height:1;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);max-width:60ch;margin:4px 0 0}

nav.tabs.stuck{background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:transparent;transition:background .2s;
  display:flex;gap:22px;overflow-x:auto;padding-block:16px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font:500 15px var(--f-ui);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;
  padding:0 0 12px;cursor:pointer;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:focus-visible, .ctrl button:focus-visible, .opts button:focus-visible, .row button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

main{padding-block:26px 120px}
html{cursor:pointer} nav.tabs, .ctrl, .q, .opts, input, .labo-box{cursor:auto}
.sec{display:none}
.sec.on{display:block}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:start}

/* l'écran de la figure : toujours sombre */
.fig{--bg:#2a43a6; --ink:#f4f6ff; --muted:#c3ccf4; --grid2:rgba(255,255,255,.17);
  --u:#a8dcff; --v:#ffb966; --sum:#ff8aa6; --diff:#6ff2bd; --proj:#dcc3ff; --hl:rgba(255,226,110,.25);
  position:sticky;top:calc(env(safe-area-inset-top, 0px) + 70px);margin:0;border-radius:22px;color:var(--ink);
  background:radial-gradient(120% 90% at 0% 0%, #4a66d6 0%, #3350bd 50%, #2a43a6 100%);
  box-shadow:0 30px 60px -35px rgba(30,50,140,.55);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.fig.drag{cursor:default;touch-action:none}
.fig > svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);padding:0 18px 14px}

/* le fil des étapes */
.panel{min-width:0;display:flex;flex-direction:column;gap:4px}
.panel h2{font-family:var(--f-disp);font-size:30px;line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.quand{margin:0 0 8px;color:var(--muted);font-size:15px}
.blk{position:relative;padding:10px 0 10px 22px;min-width:0;overflow-x:auto;transition:opacity .3s}
.blk::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--line);transition:background .3s}
.blk.cur::before{background:var(--accent)}
.blk.past:not(.st):not(.why):not(.def){opacity:.72}
.blk p{margin:0}
.blk p + p{margin-top:6px}
.blk .lbl{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:3px}
.blk.lede{padding:14px 0 16px;margin:2px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.blk.lede::before{display:none}
.blk.lede .lbl{color:var(--accent)}
.blk.lede p{font-size:19px;line-height:1.5;font-weight:500;text-wrap:pretty}
.blk.st p{font-weight:600}
.blk.def{background:var(--card);border-radius:14px;padding:12px 16px;margin:6px 0}
.blk.def::before{display:none}
.blk.bonus .lbl{color:var(--proj)}
.blk.why:not(.lede){background:var(--card);border-radius:14px;padding:12px 16px}
.blk.why:not(.lede)::before{display:none}
.blk.why:not(.lede) .lbl{color:var(--accent)}
.is-off{display:none!important}
.inl.is-off{display:inline-block!important;visibility:hidden}
.fresh{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
mjx-container[display="true"]{margin:.35em 0!important}
mjx-container g[class^="k"]{transition:opacity .35s}
.cu{color:var(--u);fill:var(--u);stroke:var(--u)}
.cv{color:var(--v);fill:var(--v);stroke:var(--v)}
.cs{color:var(--sum);fill:var(--sum);stroke:var(--sum)}
.cd{color:var(--diff);fill:var(--diff);stroke:var(--diff)}
.cp{color:var(--proj);fill:var(--proj);stroke:var(--proj)}

/* éléments des figures */
.el{transition:opacity .35s}
.el.off{opacity:0!important;pointer-events:none}
.grid line{stroke:var(--grid2);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:1.4}
.tick{font:12px var(--f-ui);fill:var(--muted)}
.seg{stroke:var(--ink);stroke-width:1.6;fill:none}
.seg.thin{stroke-width:1.2;opacity:.55}
.seg.dash{stroke-dasharray:6 5}
.seg.c-proj{stroke:var(--proj);opacity:.9} .seg.c-u{stroke:var(--u);opacity:.9} .seg.c-v{stroke:var(--v);opacity:.9}
.pt{fill:var(--ink)}
.plab{font:italic 20px var(--f-math);fill:var(--ink)}
.lab{font:600 15px var(--f-ui);fill:var(--muted)}
.lab.c-u{fill:var(--u)} .lab.c-v{fill:var(--v)} .lab.c-proj{fill:var(--proj)} .lab.c-sum{fill:var(--sum)} .lab.c-diff{fill:var(--diff)}
.vec{stroke-linecap:round}
.vec .vl{stroke:currentColor;stroke-width:3.4;fill:none}
.vec .vh{fill:currentColor;stroke:none}
.vec.thick .vl{stroke-width:4.4}
.vec.thick{filter:drop-shadow(0 0 6px currentColor)}
.vec.dashv .vl{stroke-dasharray:7 5}
.vlab text{font:italic 19px var(--f-math);fill:currentColor}
.vlab text.op{font-style:normal}
.vlab path{stroke:currentColor;stroke-width:1.3;fill:none}
.c-u{color:var(--u)} .c-v{color:var(--v)} .c-sum{color:var(--sum)} .c-diff{color:var(--diff)} .c-proj{color:var(--proj)} .c-ink{color:var(--ink)}
.arc{fill:none;stroke:var(--muted);stroke-width:1.5}
.arc.hot{stroke:var(--hl);stroke-width:3;stroke:#ffd84d}
.ra{fill:none;stroke:var(--muted);stroke-width:1.5}

/* labo */
.readout{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.readout .big{font:800 34px var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout .pos{color:var(--good)} .readout .neg{color:var(--bad)} .readout .zero{color:var(--accent)}
.gauge{position:relative;height:8px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good))}
.gauge i{position:absolute;top:-6px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px);transition:left .05s}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.labo-box{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:8px}
.labo-box::before{display:none}

/* distributivité */
.dist{position:relative;padding:46px 0 46px;white-space:nowrap;line-height:2}
.dist svg.arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dist .a-up{stroke:var(--sum);fill:none;stroke-width:1.8}
.dist .a-dn{stroke:var(--diff);fill:none;stroke-width:1.8}
.dist .op{padding:0 .28em}
.terms{white-space:nowrap;padding-left:1.2em}
.dist,.terms{font-size:.95em}

/* bilan */
.flow{display:grid;gap:0;max-width:980px}
.flow-head h2{font-family:var(--f-disp);font-weight:800;letter-spacing:-.015em}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) 30px minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.row .q1{font-size:17px}
.row .arrow{color:var(--accent);font-size:22px;text-align:center}
.row .m b{display:block;font-family:var(--f-disp);font-size:19px;font-weight:700}
.row .m small{color:var(--muted);font-size:14px}
.row button{justify-self:start}
.row button, .linkbtn{font:600 13px var(--f-ui);border:0;background:var(--soft);color:var(--accent);border-radius:999px;padding:7px 12px;cursor:pointer}
.flow-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.flow .blk.why{margin-top:18px}

/* quiz */
.quiz{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.q{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q .num{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.q > p{font-size:16.5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font:500 13.5px var(--f-ui);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.opts button.ko{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.sol{border-top:1px solid var(--line);padding-top:10px;overflow-x:auto}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}

/* barre de contrôle */
.ctrl{position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ctrl .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.ctrl button{white-space:nowrap;font:600 15px var(--f-ui);border-radius:999px;padding:11px 20px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ctrl button.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);margin-left:auto}
.ctrl button:disabled{opacity:.35;cursor:default}
.prog{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog .t{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.prog .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.hint{font-size:12px;color:var(--muted)}
footer{font-size:11px;color:var(--muted);padding-block:6px 0;text-align:right}

@media (max-width:860px){
  .stage{grid-template-columns:1fr;gap:18px}
  .fig{top:calc(env(safe-area-inset-top, 0px) + 50px);z-index:3;border-radius:18px}
  .fig > svg{max-height:40vh}
  .fig figcaption{display:none}
  .plab{font-size:24px} .lab{font-size:18px} .vlab text{font-size:22px}
  .panel h2{font-size:26px}
  .blk.lede p{font-size:17.5px}
  .row{grid-template-columns:1fr;gap:4px}
  .row .arrow{display:none}
  .hint{display:none}
  .ctrl button{padding:10px 14px}
  .ctrl .prev span{display:none}
}
@media (prefers-reduced-motion: reduce){ .fresh{animation:none} .el, mjx-container g, .blk{transition:none} }

/* site : annule le gel du body et l'invitation à tourner le téléphone ajoutés par deverrou.js */
[hidden]{display:none!important}
.ex{display:none}
body{margin:0}
html,body{height:auto!important;overflow:visible!important;overflow-x:hidden!important;position:static!important}
#mc-tourner{display:none!important}
.eyebrow .retour{color:var(--accent);text-decoration:none;font-weight:600}
.eyebrow .retour:hover{text-decoration:underline}
</style><style>
#verrou{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#E7ECF2;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:#17233A;z-index:10}
#carte{width:min(440px,92vw);background:#FFFFFF;border:1px solid #CFD9E5;border-radius:14px;padding:30px 30px 24px;
  box-shadow:0 12px 34px rgba(23,35,58,.14)}
#carte h1{font-size:22px;margin:0 0 4px;font-family:inherit;letter-spacing:0;line-height:1.2}
#carte .sous{font-size:15px;color:#6B7483;margin:0 0 22px}
#carte label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
#mdp{width:100%;font-size:18px;padding:10px 12px;border:1.5px solid #B8C6D6;border-radius:8px;box-sizing:border-box}
#mdp:focus-visible{outline:3px solid #3B6FB6;outline-offset:1px;border-color:#3B6FB6}
#ouvrir{margin-top:14px;width:100%;font-size:17px;font-weight:600;padding:11px;border:none;border-radius:8px;
  background:#17233A;color:#FFFFFF;cursor:pointer}
#ouvrir:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:12px;font-size:15px}
#msg.err{color:#C0262D}
#carte .signature{font-size:12px;color:#8C95A3;margin-top:14px;text-align:right}
</style></head>
<body><div id="verrou"><form id="carte" autocomplete="off">

<label for="mdp">Mot de passe</label><input id="mdp" type="password" required autofocus>
<button id="ouvrir" type="submit">Ouvrir le résumé</button><div id="msg" role="alert"></div>
<div class="signature">Par M.COLIN</div></form></div>
