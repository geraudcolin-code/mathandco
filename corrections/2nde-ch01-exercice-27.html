:root{--encre:#17233A;--papier:#FFFFFF;--carreau:#E2EBF6;--marge:#E8A1A1;--rouge:#D62828;--jaune:#FFD757;
  --pastille:#CFE2F8;--orange:#E2702A;--gris:#6B7483;--rose:#B05AC0;--fond:#E7ECF2;--panneau:#F6F8FB;
  --trait:#CFD9E5;--lettrebox:#C9D3DE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lettrebox:#1D242E}}
:root[data-theme="dark"]{--lettrebox:#1D242E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lettrebox);overflow:hidden}
#app{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--fond);
  font-family:'Lex',Lexend,'Segoe UI',Verdana,sans-serif;color:var(--encre);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}

/* ---------- bandeau : titre, consigne, les dix fonctions */
#bandeau{position:absolute;left:0;top:0;width:1600px;height:68px;display:flex;align-items:center;gap:18px;
  padding:0 14px 0 18px;background:var(--papier);border-bottom:1px solid var(--trait)}
#titre{flex:0 0 auto;width:470px;line-height:1.12}
#titre .ex{font-size:22px;font-weight:700}
#titre .cons{font-size:13px;color:var(--gris);margin-top:3px;white-space:normal}
#vignettes{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.vig{position:relative;height:54px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);
  cursor:pointer;overflow:hidden;padding:4px 6px 0;text-align:left}
.vig .num{font-size:13px;font-weight:700;color:var(--gris)}
.vig .f{position:absolute;left:6px;right:5px;bottom:5px;font-size:12px;white-space:nowrap;line-height:1}
.vig .f svg{max-width:100%;height:auto}
.vig:hover{border-color:#9DB2CB}
.vig.cur{border:2.5px solid var(--rouge);background:#FFF8F7}
.vig.cur .num{color:var(--rouge)}

/* ---------- page de cahier */
#page{position:absolute;left:10px;top:76px;width:1580px;height:776px;background:var(--papier);
  border:1px solid var(--trait);border-radius:4px;overflow:hidden}
#defil{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;
  background-image:linear-gradient(var(--carreau) 1px,transparent 1px),linear-gradient(90deg,var(--carreau) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
#defil::-webkit-scrollbar{width:10px}#defil::-webkit-scrollbar-thumb{background:#C5D2E1;border-radius:5px}
.fn{display:none;position:relative;padding:20px 30px 160px 100px;min-height:100%}
.fn.cur{display:block}
.fn::before{content:'';position:absolute;left:74px;top:0;bottom:0;border-left:2px solid var(--marge);pointer-events:none}
.fnum{position:absolute;left:20px;top:22px;width:44px;text-align:right;font-size:32px;font-weight:700;color:var(--rouge)}
.ftitre{font-size:38px;margin:0 0 18px;display:inline-block;position:relative}
.ln{font-size:26px;line-height:1.3;position:relative;white-space:nowrap}
.ln b{font-weight:700}
.ln.texte{white-space:normal;max-width:830px}
.mx svg{overflow:visible}
.gris{color:var(--gris)}.rose{color:var(--rose);font-weight:700}.orange{color:var(--orange)}
.hl{background:var(--jaune);padding:3px 9px;margin-left:5px;display:inline-block;border-radius:6px}
.chain{display:grid;grid-template-columns:max-content max-content max-content;align-items:center;
  column-gap:10px;row-gap:8px;font-size:26px}
.chain .lhs{justify-self:end}
.chain .note{grid-column:1 / span 3;justify-self:start;font-size:24px;color:var(--orange);padding-left:150px}
svg.ovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.under{z-index:0}.contenu{position:relative;z-index:1}svg.over{z-index:2}

/* ---------- étapes */
[data-in]{opacity:0;transition:opacity .28s ease}
[data-in].on{opacity:1}
span.tx[data-in],span.mx[data-in],div.ln[data-in]{clip-path:inset(-250% 100% -250% -4%);
  transition:opacity .2s ease,clip-path .45s ease}
span.tx[data-in].on,span.mx[data-in].on,div.ln[data-in].on{clip-path:inset(-250% -6% -250% -4%)}
#app.saut *{transition:none!important}

/* ---------- panneau d'outils */
#panneau{position:absolute;left:968px;top:88px;width:612px;height:752px;background:var(--panneau);
  border:1px solid var(--trait);border-radius:10px;display:flex;flex-direction:column;z-index:5;
  box-shadow:0 10px 30px rgba(23,35,58,.16),0 1px 3px rgba(23,35,58,.10);transition:transform .35s ease,opacity .35s ease}
#panneau.ferme{transform:translateX(640px);opacity:0;pointer-events:none}
#rabat{position:absolute;right:10px;top:12px;border:none;background:none;font-size:15px;color:var(--gris);cursor:pointer;padding:4px 8px}
#rouvrir{position:absolute;right:10px;top:96px;z-index:4;border:1.5px solid var(--trait);background:var(--papier);border-radius:8px;
  padding:10px 9px;font-size:15px;font-weight:700;color:var(--encre);cursor:pointer;writing-mode:vertical-rl;transform:rotate(180deg);display:none}
#panneau.ferme ~ #rouvrir{display:block}
#onglets{display:flex;gap:2px;padding:10px 90px 0 10px;border-bottom:1px solid var(--trait)}
.ong{flex:1;border:none;background:none;padding:9px 4px 11px;font-size:16px;font-weight:700;color:var(--gris);
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ong .k{font-weight:400;font-size:13px;color:#98A1AE;margin-left:5px}
.ong.cur{color:var(--encre);border-bottom-color:var(--encre)}
.ong.signal{color:var(--rouge)}
.vue{display:none;flex:1;padding:16px 6px 10px;position:relative;overflow:hidden}
.vue.cur{display:block}
.legende{font-size:15px;color:var(--gris);margin:0 0 10px 0;line-height:1.35}
.capt{position:relative;display:inline-block;max-width:100%}
.capt img{display:block;width:100%;height:auto;box-shadow:0 2px 0 rgba(23,35,58,.08)}
#v-enonce .capt,#v-cours .capt{width:596px}
.cadre{position:absolute;border:3px solid var(--rouge);pointer-events:none}
.souligne{position:absolute;height:0;border-top:3.5px solid #3B6FB6;pointer-events:none}

.puce.cur{border-color:var(--encre)}
#rien{font-size:17px;color:var(--gris);padding:10px 4px}
/* graphique */
#gsvg{display:block;width:596px;height:454px;background:var(--papier);border:1px solid var(--trait);border-radius:4px}
#gzone{position:relative;width:596px}
#gdef{position:absolute;background:#FFFFFF;border:1.5px solid #1F5FAF;border-radius:6px;padding:4px 9px;color:#1F5FAF;font-size:17px;white-space:nowrap}
#gctl{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--trait);background:var(--papier);border-radius:6px;padding:6px 12px;font-size:15px;cursor:pointer}
.btn:hover{border-color:#9DB2CB}
.btn.on{background:var(--encre);color:#fff;border-color:var(--encre)}
#gfen{font-size:14px;color:var(--gris);margin-left:auto}
/* valeurs */
#tables{display:flex;gap:18px}
table.val{border-collapse:collapse;font-size:18px;flex:1;background:var(--papier)}
table.val caption{font-size:16px;color:var(--gris);text-align:left;padding-bottom:6px}
table.val th,table.val td{border:1px solid var(--trait);padding:7px 10px;text-align:right;white-space:nowrap}
table.val th{background:#EEF3F9;font-weight:700}

/* ---------- barre du bas */
#barre{position:absolute;left:0;top:856px;width:1600px;height:44px;display:flex;align-items:center;gap:9px;
  padding:0 18px;background:var(--papier);border-top:1px solid var(--trait)}
.ico{width:42px;height:34px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
#pas{font-size:17px;min-width:150px}
#piste{position:relative;width:250px;height:6px;background:#E3E9F1;border-radius:3px;overflow:hidden}
#remplir{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--encre);transition:width .25s}
.esp{flex:1}
#sig{font-size:13px;color:#8C95A3;margin-left:6px}
#bAuto{position:relative;width:auto;padding:0 12px 0 8px;gap:7px;font-size:15px;font-weight:700}
#bAuto svg.anneau{width:24px;height:24px}
#bAuto .fond{fill:none;stroke:#E3E9F1;stroke-width:3}
#bAuto .prog{fill:none;stroke:var(--rouge);stroke-width:3;stroke-dasharray:62.8;stroke-dashoffset:62.8;transform:rotate(-90deg);transform-origin:12px 12px}
#bAuto.lecture{border-color:var(--rouge)}
.vit{display:flex;border:1.5px solid var(--trait);border-radius:7px;overflow:hidden}
.vit button{border:none;background:var(--papier);padding:6px 10px;font-size:14px;cursor:pointer;color:var(--gris)}
.vit button.cur{background:var(--encre);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.code .trou[data-in]:not(.on),.code .rempli[data-in]:not(.on){display:none}
.code .rempli{color:#D62828;font-weight:700}
#consZone{display:none}
#panneau.large .vue{padding:8px 8px 4px}

.consfig g[data-in]{transition:opacity .25s ease var(--d,0s)}
.consfig .mk{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset .65s cubic-bezier(.3,.4,.45,1) var(--d,0s)}
.consfig g.on .mk{stroke-dashoffset:0}

@media (prefers-reduced-motion:reduce){.consfig .mk,.consfig path.tr{stroke-dashoffset:0!important}}

/* ------------------------------------------------ surimpressions de la page (calculées à l'entrée) */
/* SERRE_EGAL */ function serrerEgal(sec){
  const C = sec.querySelector('.contenu'); if (!C) return;
  const lignes = [...C.children];
  const cle = e => { if (!e.classList || !e.classList.contains('ln')) return null;
    const f = e.firstElementChild; if (!f) return null;
    if (f.classList.contains('lhs7')) return 'l|' + f.style.width;
    if (f.style && f.style.minWidth && f.style.display === 'inline-flex') return 'r|' + f.style.minWidth;
    if (f.style && f.style.width && f.style.display === 'inline-block' && !f.className && !f.childElementCount) return 'r|' + f.style.width;
    return null; };
  let grp = [], k0 = null;
  const fin = () => { if (grp.length){ const lhs = grp[0].classList.contains('lhs7');
      let mx = 0;
      const vide = s => s.style.display === 'inline-block' && !s.childElementCount;
      const avant = grp.map(s => [s.style.width, s.style.minWidth]);
      const decl = parseFloat(lhs ? grp[0].style.width : (grp[0].style.minWidth || grp[0].style.width)) || 0;
      for (const s of grp){ if (lhs) s.style.width = 'auto'; else if (vide(s)) continue; else s.style.minWidth = '0px';
        mx = Math.max(mx, s.offsetWidth); }
      if (mx + (lhs ? 4 : 0) >= decl){ grp.forEach((s, j) => { s.style.width = avant[j][0]; s.style.minWidth = avant[j][1]; }); }
      else for (const s of grp){ if (lhs) s.style.width = (mx + 4) + 'px'; else if (vide(s)) s.style.width = mx + 'px'; else s.style.minWidth = mx + 'px'; } }
    grp = []; k0 = null; };
  for (const e of lignes){ const k = cle(e);
    if (k === null){ if (e.classList && e.classList.contains('marge')) continue;
      if (parseFloat((e.style && e.style.marginLeft) || 0) > 0) continue;   /* ligne en retrait (justification) : le groupe continue */
      fin(); continue; }
    if (k !== k0) fin();
    k0 = k; grp.push(e.firstElementChild); }
  fin(); }
function construire(i){

      const r = rel(document.getElementById(o.anchor), Cn), app = document.getElementById('app').getBoundingClientRect();
      const left = 940 - (Cn.getBoundingClientRect().left - app.left)/scale - e.offsetWidth, H = e.offsetHeight;

        const q = rel(b, Cn); if (q.w > 0 && q.x + q.w > left - 8) bx.push(q); }

function octets(b64){ const t = atob(b64), u = new Uint8Array(t.length); for (let k = 0; k < t.length; k++) u[k] = t.charCodeAt(k); return u; }
async function dechiffrer(mdp){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name:'PBKDF2', salt:octets(P.s), iterations:P.n, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:octets(P.i)}, cle, octets(P.c));
  return JSON.parse(new TextDecoder().decode(clair));
}
