<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[2nd]CH02_Combinaisons_Vecteurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* Mise en page : quadrillage à gauche (la figure), panneau de lecture et de réglages à droite. */
:root{
  box-sizing:border-box;
  --desk:#eef2f8;
  --sheet:#ffffff;
  --grid:#d6e2f2;
  --ink:#1a2640;
  --muted:#56637c;
  --rule:#cfd8e6;
  --c0:#1f55c9;
  --c1:#12804b;
  --c2:#7a3cb5;
  --c3:#b26a00;
  --c4:#08879c;
  --sum:#d1262b;
  --prev:#8a96ab;
  --hl:#ffe9a3;
  --ask:#fff4cf;
  --ask-edge:#e0b100;
  --btn:#1a2640;
  --btn-ink:#ffffff;
  --focus:#e6a700;
  --math:"STIX Two Text","Cambria Math","Cambria","Times New Roman",serif;
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#121826;--sheet:#182033;--grid:#26324b;--ink:#e6ebf4;--muted:#9eaac0;--rule:#2b3650;
    --c0:#78a6ff;--c1:#4fcf8f;--c2:#bd93f2;--c3:#f2ae45;--c4:#4ccbe0;--sum:#ff6b6e;--prev:#6f7c95;
    --hl:#5a4a12;--ask:#3a3216;--ask-edge:#c9a02a;--btn:#e6ebf4;--btn-ink:#121826;--focus:#f2c230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#121826;--sheet:#182033;--grid:#26324b;--ink:#e6ebf4;--muted:#9eaac0;--rule:#2b3650;
  --c0:#78a6ff;--c1:#4fcf8f;--c2:#bd93f2;--c3:#f2ae45;--c4:#4ccbe0;--sum:#ff6b6e;--prev:#6f7c95;
  --hl:#5a4a12;--ask:#3a3216;--ask-edge:#c9a02a;--btn:#e6ebf4;--btn-ink:#121826;--focus:#f2c230;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.stage-col{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 10px 18px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:0 4px 12px}
h1{font-size:1.45rem;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer;opacity:.45}
.dot.done{background:var(--ink);opacity:.45}
.dot.cur{background:var(--ink);opacity:1;transform:scale(1.15)}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{width:100%;height:100%;max-height:100%;display:block;user-select:none;-webkit-user-select:none}
#stage.dragging{cursor:grabbing}

.panel{border-left:1px solid var(--rule);padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.counter{font-weight:700;color:var(--muted);font-size:1rem}
.text{flex:1 0 auto;font-size:1.25rem;line-height:1.7;min-height:8em;min-width:0}
.text p{margin:0 0 .75em}
.text .muted{color:var(--muted);font-size:1.06rem}
.text .key{border-left:4px solid var(--sum);padding:.15em 0 .15em .75em;font-size:1.12rem}
.text .ask{background:var(--ask);border-left:4px solid var(--ask-edge);padding:.35em .8em;border-radius:0 8px 8px 0;font-weight:700;font-size:1.12rem}
.nav{display:grid;grid-template-columns:auto 1fr;gap:10px}
.nav2{display:flex;gap:10px;flex-wrap:wrap}
.btn{white-space:nowrap;font:700 1.05rem/1.2 var(--ui);padding:.75em 1em;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.small{font-size:.95rem;padding:.5em .8em;border-width:1.5px}
.btn:disabled{opacity:.35;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.settings{border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:12px;font-size:.98rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{font:700 .98rem var(--ui);border:0;background:transparent;color:var(--ink);padding:.4em .85em;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg.wide{display:flex}
.seg.wide button{flex:1;padding:.5em .4em}
.coefrow{display:flex;flex-direction:column;gap:7px}
.coefs{display:flex;flex-wrap:wrap;gap:8px}
.coef{display:inline-flex;align-items:center;border:1.5px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--sheet)}
.coef button{font:700 1.05rem var(--ui);width:2em;height:2.1em;border:0;background:transparent;color:var(--ink);cursor:pointer}
.coef button:hover:not(:disabled){background:var(--desk)}
.coef button:disabled{opacity:.3;cursor:default}
.coef button:first-child{border-right:1px solid var(--rule)}
.coef button:last-child{border-left:1px solid var(--rule)}
.coef .cv{min-width:2.9em;text-align:center;font-family:var(--math);font-size:1.12rem;white-space:nowrap}
.chk,.rng{display:flex;align-items:center;gap:9px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.rng input{flex:1;accent-color:var(--ink)}
.hint{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.msg{color:var(--sum);font-size:.92rem;min-height:1.2em;margin:0}

/* notation mathématique */
.vec{position:relative;display:inline-block;font-family:var(--math);font-style:italic;font-size:1.12em;line-height:1;padding:0 .05em}
.vec.pt{font-style:normal}
.vec::before{content:"";position:absolute;left:.1em;right:.2em;top:.04em;border-top:.075em solid currentColor}
.vec::after{content:"";position:absolute;right:0;top:-.075em;width:0;height:0;border-left:.3em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.vec.pt::before{left:.06em;right:.22em;top:-.17em}
.vec.pt::after{right:.02em;top:-.285em}
.vec .hl{background:var(--hl);border-radius:3px;box-shadow:0 0 0 1px var(--hl)}
.k{font-family:var(--math);font-size:1.12em}
.pname{font-family:var(--math);font-size:1.12em}
.nw{white-space:nowrap}
.op{font-family:var(--math);padding:0 .18em}
.eq{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.3em;row-gap:.25em;align-items:baseline;font-size:1.15em;margin:.15em 0 .9em;line-height:2}
.eq .full{grid-column:1 / -1}
.col{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--math);line-height:1.25;padding:.1em .45em;margin:0 .12em;position:relative;font-size:.92em}
.col::before,.col::after{content:"";position:absolute;top:0;bottom:0;width:.4em}
.col::before{left:0;border-left:.085em solid currentColor;border-radius:50% 0 0 50% / 50% 0 0 50%}
.col::after{right:0;border-right:.085em solid currentColor;border-radius:0 50% 50% 0 / 0 50% 50% 0}
.coordeq{font-size:1em}

/* figure */
.bg{fill:var(--sheet)}
.gridl{stroke:var(--grid);stroke-width:1;fill:none}
.prevl{fill:none;stroke:var(--prev);stroke-width:2.5;stroke-dasharray:8 7}
.guide line{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 6}
.leg{stroke-width:2.2;stroke-dasharray:6 5;fill:none}
.mt{font-family:var(--math);font-style:italic}
.pl{font-family:var(--math);font-style:normal}
.lbl text,.ptl{paint-order:stroke;stroke:var(--sheet);stroke-width:6px;stroke-linejoin:round}
.credit{font-family:var(--ui);font-size:12px;fill:var(--muted)}
.hit{stroke:transparent;stroke-width:22;stroke-linecap:round;cursor:grab;touch-action:none}
.tip{fill:transparent;stroke:currentColor;stroke-width:2;stroke-opacity:0;cursor:crosshair;touch-action:none}
.tip:hover,.tip:focus{stroke-opacity:.9}
.hA{fill:transparent;cursor:grab;touch-action:none}
.pulse{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.3);opacity:.95}to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.6;transform:scale(.6)}}

@media (max-width: 900px){
  .app{display:block;height:auto}
  .stage-col{padding:14px 16px 6px}
  #stage{height:auto;aspect-ratio:24/15;max-width:100%}
  .panel{border-left:0;border-top:1px solid var(--rule);overflow:visible;padding:18px 16px}
  .text{font-size:1.12rem;min-height:0}
  h1{font-size:1.2rem}
}

/* site : annule le gel du body et l'invitation à tourner le téléphone ajoutés par deverrou.js */
[hidden]{display:none!important}
.ex{display:none}
#mc-tourner{display:none!important}
html,body{position:static!important;overflow-x:hidden!important;overflow-y:auto!important}
</style><style>
#verrou{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#E7ECF2;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:#17233A;z-index:20}
#carte{width:min(440px,92vw);background:#FFFFFF;border:1px solid #CFD9E5;border-radius:14px;padding:30px 30px 24px;
  box-shadow:0 12px 34px rgba(23,35,58,.14)}
#carte h1{font-size:22px;margin:0 0 4px;font-family:inherit;letter-spacing:0;line-height:1.2}
#carte .sous{font-size:15px;color:#6B7483;margin:0 0 22px}
#carte label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
#mdp{width:100%;font-size:18px;padding:10px 12px;border:1.5px solid #B8C6D6;border-radius:8px;box-sizing:border-box}
#mdp:focus-visible{outline:3px solid #3B6FB6;outline-offset:1px;border-color:#3B6FB6}
#ouvrir{margin-top:14px;width:100%;font-size:17px;font-weight:600;padding:11px;border:none;border-radius:8px;
  background:#17233A;color:#FFFFFF;cursor:pointer}
#ouvrir:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:12px;font-size:15px}
#msg.err{color:#C0262D}
#carte .signature{font-size:12px;color:#8C95A3;margin-top:14px;text-align:right}
</style></head>

<button id="ouvrir" type="submit">Ouvrir l’animation</button><div id="msg" role="alert"></div>

function octets(b64){ const t = atob(b64), u = new Uint8Array(t.length); for (let k = 0; k < t.length; k++) u[k] = t.charCodeAt(k); return u; }
async function dechiffrer(mdp){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name:'PBKDF2', salt:octets(P.s), iterations:P.n, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:octets(P.i)}, cle, octets(P.c));
  return JSON.parse(new TextDecoder().decode(clair));
}
document.getElementById('carte').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('ouvrir'), m = document.getElementById('msg'), champ = document.getElementById('mdp');
  if (!window.crypto || !crypto.subtle){ m.className = 'err'; m.textContent = 'Ce navigateur ne permet pas d’ouvrir une page protégée.'; return; }
  b.disabled = true; m.className = ''; m.textContent = 'Ouverture…';
  let contenu;
  try { contenu = await dechiffrer(champ.value); }
  catch (e) { b.disabled = false; m.className = 'err'; m.textContent = 'Mot de passe incorrect.'; champ.select(); return; }
  document.getElementById('verrou').remove();
  document.body.insertAdjacentHTML('beforeend', contenu.body);
  (new Function(contenu.data.js))();
});
