:root{--encre:#17233A;--papier:#FFFFFF;--carreau:#E2EBF6;--marge:#E8A1A1;--rouge:#D62828;--jaune:#FFD757;
  --pastille:#CFE2F8;--orange:#E2702A;--gris:#6B7483;--rose:#B05AC0;--fond:#E7ECF2;--panneau:#F6F8FB;
  --trait:#CFD9E5;--lettrebox:#C9D3DE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lettrebox:#1D242E}}
:root[data-theme="dark"]{--lettrebox:#1D242E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lettrebox);overflow:hidden}
#app{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--fond);
  font-family:'Lex',Lexend,'Segoe UI',Verdana,sans-serif;color:var(--encre);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}

/* ---------- bandeau : titre, consigne, les dix fonctions */
#bandeau{position:absolute;left:0;top:0;width:1600px;height:68px;display:flex;align-items:center;gap:18px;
  padding:0 14px 0 18px;background:var(--papier);border-bottom:1px solid var(--trait)}
#titre{flex:0 0 auto;width:470px;line-height:1.12}
#titre .ex{font-size:22px;font-weight:700}
#titre .cons{font-size:13px;color:var(--gris);margin-top:3px;white-space:normal}
#vignettes{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.vig{position:relative;height:54px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);
  cursor:pointer;overflow:hidden;padding:4px 6px 0;text-align:left}
.vig .num{font-size:13px;font-weight:700;color:var(--gris)}
.vig .f{position:absolute;left:6px;right:5px;bottom:5px;font-size:12px;white-space:nowrap;line-height:1}
.vig .f svg{max-width:100%;height:auto}
.vig:hover{border-color:#9DB2CB}
.vig.cur{border:2.5px solid var(--rouge);background:#FFF8F7}
.vig.cur .num{color:var(--rouge)}

/* ---------- page de cahier */
#page{position:absolute;left:10px;top:76px;width:1580px;height:776px;background:var(--papier);
  border:1px solid var(--trait);border-radius:4px;overflow:hidden}
#defil{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;
  background-image:linear-gradient(var(--carreau) 1px,transparent 1px),linear-gradient(90deg,var(--carreau) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
#defil::-webkit-scrollbar{width:10px}#defil::-webkit-scrollbar-thumb{background:#C5D2E1;border-radius:5px}
.fn{display:none;position:relative;padding:20px 30px 160px 100px;min-height:100%}
.fn.cur{display:block}
.fn::before{content:'';position:absolute;left:74px;top:0;bottom:0;border-left:2px solid var(--marge);pointer-events:none}
.fnum{position:absolute;left:20px;top:22px;width:44px;text-align:right;font-size:32px;font-weight:700;color:var(--rouge)}
.ftitre{font-size:38px;margin:0 0 18px;display:inline-block;position:relative}
.ln{font-size:26px;line-height:1.3;position:relative;white-space:nowrap}
.ln b{font-weight:700}
.ln.texte{white-space:normal;max-width:830px}
.mx svg{overflow:visible}
.gris{color:var(--gris)}.rose{color:var(--rose);font-weight:700}.orange{color:var(--orange)}
.hl{background:var(--jaune);padding:3px 9px;margin-left:5px;display:inline-block;border-radius:6px}
.chain{display:grid;grid-template-columns:max-content max-content max-content;align-items:center;
  column-gap:10px;row-gap:8px;font-size:26px}
.chain .lhs{justify-self:end}
.chain .note{grid-column:1 / span 3;justify-self:start;font-size:24px;color:var(--orange);padding-left:150px}
svg.ovl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.under{z-index:0}.contenu{position:relative;z-index:1}svg.over{z-index:2}

/* ---------- étapes */
[data-in]{opacity:0;transition:opacity .28s ease}
[data-in].on{opacity:1}
span.tx[data-in],span.mx[data-in],div.ln[data-in]{clip-path:inset(-250% 100% -250% -4%);
  transition:opacity .2s ease,clip-path .45s ease}
span.tx[data-in].on,span.mx[data-in].on,div.ln[data-in].on{clip-path:inset(-250% -6% -250% -4%)}
#app.saut *{transition:none!important}

/* ---------- panneau d'outils */
#panneau{position:absolute;left:968px;top:88px;width:612px;height:752px;background:var(--panneau);
  border:1px solid var(--trait);border-radius:10px;display:flex;flex-direction:column;z-index:5;
  box-shadow:0 10px 30px rgba(23,35,58,.16),0 1px 3px rgba(23,35,58,.10);transition:transform .35s ease,opacity .35s ease}
#panneau.ferme{transform:translateX(640px);opacity:0;pointer-events:none}
#rabat{position:absolute;right:10px;top:12px;border:none;background:none;font-size:15px;color:var(--gris);cursor:pointer;padding:4px 8px}
#rouvrir{position:absolute;right:10px;top:96px;z-index:4;border:1.5px solid var(--trait);background:var(--papier);border-radius:8px;
  padding:10px 9px;font-size:15px;font-weight:700;color:var(--encre);cursor:pointer;writing-mode:vertical-rl;transform:rotate(180deg);display:none}
#panneau.ferme ~ #rouvrir{display:block}
#onglets{display:flex;gap:2px;padding:10px 90px 0 10px;border-bottom:1px solid var(--trait)}
.ong{flex:1;border:none;background:none;padding:9px 4px 11px;font-size:16px;font-weight:700;color:var(--gris);
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ong .k{font-weight:400;font-size:13px;color:#98A1AE;margin-left:5px}
.ong.cur{color:var(--encre);border-bottom-color:var(--encre)}
.ong.signal{color:var(--rouge)}
.vue{display:none;flex:1;padding:16px 6px 10px;position:relative;overflow:hidden}
.vue.cur{display:block}
.legende{font-size:15px;color:var(--gris);margin:0 0 10px 0;line-height:1.35}
.capt{position:relative;display:inline-block;max-width:100%}
.capt img{display:block;width:100%;height:auto;box-shadow:0 2px 0 rgba(23,35,58,.08)}
#v-enonce .capt,#v-cours .capt{width:596px}
.cadre{position:absolute;border:3px solid var(--rouge);pointer-events:none}
.souligne{position:absolute;height:0;border-top:3.5px solid #3B6FB6;pointer-events:none}
#listeCours{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.puce{border:1.5px solid var(--trait);background:var(--papier);border-radius:16px;padding:5px 12px;font-size:15px;cursor:pointer}
.puce.cur{border-color:var(--encre)}
#rien{font-size:17px;color:var(--gris);padding:10px 4px}
/* graphique */
#gsvg{display:block;width:596px;height:454px;background:var(--papier);border:1px solid var(--trait);border-radius:4px}
#gzone{position:relative;width:596px}
#gdef{position:absolute;background:#FFFFFF;border:1.5px solid #1F5FAF;border-radius:6px;padding:4px 9px;color:#1F5FAF;font-size:17px;white-space:nowrap}
#gctl{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--trait);background:var(--papier);border-radius:6px;padding:6px 12px;font-size:15px;cursor:pointer}
.btn:hover{border-color:#9DB2CB}
.btn.on{background:var(--encre);color:#fff;border-color:var(--encre)}
#gfen{font-size:14px;color:var(--gris);margin-left:auto}
/* valeurs */
#tables{display:flex;gap:18px}
table.val{border-collapse:collapse;font-size:18px;flex:1;background:var(--papier)}
table.val caption{font-size:16px;color:var(--gris);text-align:left;padding-bottom:6px}
table.val th,table.val td{border:1px solid var(--trait);padding:7px 10px;text-align:right;white-space:nowrap}
table.val th{background:#EEF3F9;font-weight:700}

/* ---------- barre du bas */
#barre{position:absolute;left:0;top:856px;width:1600px;height:44px;display:flex;align-items:center;gap:9px;
  padding:0 18px;background:var(--papier);border-top:1px solid var(--trait)}
.ico{width:42px;height:34px;border:1.5px solid var(--trait);border-radius:7px;background:var(--papier);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
#pas{font-size:17px;min-width:150px}
#piste{position:relative;width:250px;height:6px;background:#E3E9F1;border-radius:3px;overflow:hidden}
#remplir{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--encre);transition:width .25s}
.esp{flex:1}
#sig{font-size:13px;color:#8C95A3;margin-left:6px}
#bAuto{position:relative;width:auto;padding:0 12px 0 8px;gap:7px;font-size:15px;font-weight:700}
#bAuto svg.anneau{width:24px;height:24px}
#bAuto .fond{fill:none;stroke:#E3E9F1;stroke-width:3}
#bAuto .prog{fill:none;stroke:var(--rouge);stroke-width:3;stroke-dasharray:62.8;stroke-dashoffset:62.8;transform:rotate(-90deg);transform-origin:12px 12px}
#bAuto.lecture{border-color:var(--rouge)}
.vit{display:flex;border:1.5px solid var(--trait);border-radius:7px;overflow:hidden}
.vit button{border:none;background:var(--papier);padding:6px 10px;font-size:14px;cursor:pointer;color:var(--gris)}
.vit button.cur{background:var(--encre);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mx svg svg{overflow:hidden}   /* délimiteurs étirés (barres ‖ | autour d'une fraction) : sans cela, le morceau étiré de
   MathJax déborde de son cadre (le « .mx svg{overflow:visible} » de html_v2 vaut aussi pour les svg imbriqués) */
.chain{display:grid;grid-template-columns:max-content max-content max-content;align-items:baseline;column-gap:8px;row-gap:10px;
  font-size:26px;margin-left:10px}
.chain .lhs{justify-self:end;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.chain .lhs .pre{margin-right:6px}
.chain .eqc{white-space:nowrap}
.chain .rest{white-space:nowrap;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;max-width:700px}
.chain .note{font-size:19px;color:var(--gris);display:inline-flex;align-items:center;gap:5px;flex-basis:100%;padding-left:6px;margin-top:-2px}
.ln .note{font-size:19px;color:var(--gris);margin-left:14px}
.ln.texte{max-width:830px}
.ftitre:empty{display:none}
#vignettes{grid-auto-columns:max-content}
.vig{min-width:150px;max-width:260px}
.rouge{color:#E02020;font-weight:700}
.tx.gras{font-weight:700}
.tx.lead{margin-right:8px}
#v-figure{padding:10px 8px}
#figzone{position:relative;width:596px;height:560px;background:var(--papier);border:1px solid var(--trait);border-radius:4px;overflow:hidden}
#fsvg{position:absolute;left:0;top:0;width:596px;height:560px}
#flab{position:absolute;left:0;top:0;width:596px;height:560px;pointer-events:none}
#flab .fl{position:absolute;white-space:nowrap;line-height:1}
#figzone [data-in]{transition:opacity .35s ease}
#figzone .mv{transition:opacity .35s ease,transform .9s ease}
#figzone line.draw,#figzone path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .7s ease,opacity .2s,stroke .6s}
#figzone .on line.draw,#figzone .on path.draw,#figzone line.draw.on,#figzone path.draw.on{stroke-dashoffset:0}
#figzone .tete{opacity:0;transition:opacity .25s ease .55s,fill .6s}
#figzone .on .tete{opacity:1}
.legfig{font-size:15px;color:var(--gris);margin:0 0 8px}
.cadre.bleu{border-color:#2F6FD6}
svg.ovl path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .85s cubic-bezier(.2,.7,.4,1),opacity .15s}
svg.ovl g.on path.draw{stroke-dashoffset:0}
svg.ovl path.tete{opacity:0;transition:opacity .2s ease .75s}
svg.ovl g.on path.tete{opacity:1}
</style><style>
#verrou{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#E7ECF2;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:#17233A;z-index:10}
#carte{width:min(440px,92vw);background:#FFFFFF;border:1px solid #CFD9E5;border-radius:14px;padding:30px 30px 24px;
  box-shadow:0 12px 34px rgba(23,35,58,.14)}
#carte h1{font-size:22px;margin:0 0 4px}
#carte .sous{font-size:15px;color:#6B7483;margin:0 0 22px}
#carte label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
#mdp{width:100%;font-size:18px;padding:10px 12px;border:1.5px solid #B8C6D6;border-radius:8px;box-sizing:border-box}
#mdp:focus-visible{outline:3px solid #3B6FB6;outline-offset:1px;border-color:#3B6FB6}
#ouvrir{margin-top:14px;width:100%;font-size:17px;font-weight:600;padding:11px;border:none;border-radius:8px;
  background:#17233A;color:#FFFFFF;cursor:pointer}
#ouvrir:disabled{opacity:.6;cursor:wait}
#ouvrir:focus-visible{outline:3px solid #3B6FB6;outline-offset:2px}
#msg{min-height:22px;margin-top:12px;font-size:15px}
#msg.err{color:#C0262D}
#carte .signature{font-size:12px;color:#8C95A3;margin-top:14px;text-align:right}
</style></head>

function demarrer(DATA){
const FORM = DATA.FORM;

const SCR = DATA.SCREENS, ITEMS = DATA.ITEMS, IMGS = DATA.IMGS, NOMS = DATA.NOMS;
const app = document.getElementById('app'), defil = document.getElementById('defil');
let scale = 1, cur = 0, step = 0, tab = 'enonce', coursManuel = null;
function fit(){ const W = innerWidth, Hh = innerHeight; scale = Math.min(W / 1600, Hh / 900);
  app.style.transform = `translate(${(W - 1600*scale)/2}px,${(Hh - 900*scale)/2}px) scale(${scale})`; }
addEventListener('resize', fit); fit();
document.querySelectorAll('img[data-src]').forEach(im => { im.src = IMGS[im.dataset.src]; });
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, a, p){ const e = document.createElementNS(NS, tag); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function rel(el, ref){ if (el.classList && el.classList.contains('mx')){ const s = el.querySelector('svg'); if (s) el = s; }
  const r = el.getBoundingClientRect(), q = ref.getBoundingClientRect();
  return {x:(r.left - q.left)/scale, y:(r.top - q.top)/scale, w:r.width/scale, h:r.height/scale}; }
function head(g, x, y, ang, col, cls){ const a = .45, L = 15;

function longueur(p){ p.style.setProperty('--len', (p.getTotalLength ? p.getTotalLength() : 600) + 2); }

/* ------------------------------------------------ surimpressions de la page (calculées à l'entrée) */
function construire(i){
  const sc = SCR[i], sec = document.getElementById('fn' + i);
  if (sec.dataset.ok) return;
  const U = sec.querySelector('svg.under'), O = sec.querySelector('svg.over');
  const B = id => rel(document.getElementById(id), sec);
  for (const o of sc.ov){
    let e = null;

      for (const id of o.ids){ const b = B(id), p = o.pad ?? 4, h = b.h + 2*p;
        mk('rect', {x:b.x - p - 5, y:b.y - p, width:b.w + 2*p + 10, height:h, rx:Math.min(h/2, 26), fill:o.col || '#CFE2F8', filter:'url(#flou)'}, e); } }
    else if (o.t === 'slash'){ const b = B(o.id);
      e = mk('line', {x1:b.x - 4, y1:b.y + b.h + 3, x2:b.x + b.w + 4, y2:b.y - 3, stroke:'#D62828', 'stroke-width':3.2, 'stroke-linecap':'round'}, O); }
    else if (o.t === 'arc' || o.t === 'arcb'){ const a = B(o.frm), b = B(o.to); e = mk('g', {}, O);
      const bas = o.t === 'arcb', s = bas ? -1 : 1;
      const x0 = a.x + a.w/2, y0 = bas ? a.y + a.h + 2 : a.y - 2, x1 = b.x + b.w/2, y1 = bas ? b.y + b.h + 4 : b.y - 4, hh = Math.min(70, 26 + Math.abs(x1 - x0)*0.22);
      const p = mk('path', {d:`M${x0},${y0} C${x0 + (x1 - x0)*0.25},${y0 - s*hh} ${x0 + (x1 - x0)*0.75},${y1 - s*hh} ${x1},${y1}`, fill:'none', stroke:o.col, 'stroke-width':2.6, 'stroke-linecap':'round', class:'draw'}, e);
      longueur(p); head(e, x1, y1, Math.atan2(s*hh*0.75, (x1 - x0)*0.25), o.col, 'tete');
      if (o.lab){ const t = mk('text', {x:(x0 + x1)/2, y:(y0 + y1)/2 - s*hh*0.78 + (bas ? 14 : 0), 'text-anchor':'middle', 'font-size':17, 'font-weight':700, fill:o.col, 'font-family':'Lex, Lexend, sans-serif'}, e); t.textContent = o.lab; } }
    else if (o.t === 'note'){ const a = B(o.frm), b = B(o.to); e = mk('g', {}, O);
      const x0 = a.x + Math.min(120, a.w*.45), y0 = a.y + 2, x1 = b.x + b.w/2, y1 = b.y + b.h + 3;
      mk('path', {d:`M${x0},${y0} C${x0 + 30},${y0 - 30} ${x1 - 30},${y1 + 34} ${x1},${y1}`, fill:'none', stroke:'#E2702A', 'stroke-width':2.4}, e);
      head(e, x1, y1, Math.atan2(-34, 30), '#E2702A'); }
    if (e){ e.dataset.in = o.in; if (o.out != null) e.dataset.out = o.out; }
  }

}

/* ------------------------------------------------ figure (dans la fiche) */
let figCur = -1;
function figure(i){
  if (figCur === i) return; figCur = i;
  const sc = SCR[i], S = document.getElementById('fsvg'), L = document.getElementById('flab');
  S.innerHTML = ''; L.innerHTML = '';
  if (!sc.fig || !sc.fig.els.length){ document.getElementById('figvide').style.display = 'block'; return; }
  document.getElementById('figvide').style.display = 'none';
  for (const e of sc.fig.els){
    let g = null;
    if (e.t === 'grid'){ g = mk('g', {stroke:e.col, 'stroke-width':1.1}, S);
      for (const x of e.xs) mk('line', {x1:x, y1:e.ys[0], x2:x, y2:e.ys[e.ys.length - 1]}, g);
      for (const y of e.ys) mk('line', {x1:e.xs[0], y1:y, x2:e.xs[e.xs.length - 1], y2:y}, g); }
    else if (e.t === 'seg'){ g = mk('g', {class:'mv'}, S);
      const l = mk('line', {x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2, stroke:e.col, 'stroke-width':e.lw, 'stroke-linecap':'round', 'stroke-dasharray':e.dash ? '9 7' : null, class:e.draw ? 'draw' : ''}, g);
      if (e.draw) l.style.setProperty('--len', Math.hypot(e.x2 - e.x1, e.y2 - e.y1) + 2); }
    else if (e.t === 'vec'){ g = mk('g', {class:'mv'}, S);
      const ang = Math.atan2(e.y2 - e.y1, e.x2 - e.x1), L = 14, xe = e.x2 - 9*Math.cos(ang), ye = e.y2 - 9*Math.sin(ang);
      const l = mk('line', {x1:e.x1, y1:e.y1, x2:xe, y2:ye, stroke:e.col, 'stroke-width':e.lw, 'stroke-linecap':'round', 'stroke-dasharray':e.dash ? '10 7' : null, class:'draw'}, g);
      l.style.setProperty('--len', Math.hypot(xe - e.x1, ye - e.y1) + 2);
      mk('path', {d:`M${e.x2},${e.y2} L${e.x2 - L*Math.cos(ang - .42)},${e.y2 - L*Math.sin(ang - .42)} L${e.x2 - L*Math.cos(ang + .42)},${e.y2 - L*Math.sin(ang + .42)} Z`, fill:e.col, class:'tete'}, g); }
    else if (e.t === 'cross'){ g = mk('g', {class:'mv', stroke:e.col, 'stroke-width':2.6, 'stroke-linecap':'round'}, S);
      mk('line', {x1:e.x - e.s, y1:e.y, x2:e.x + e.s, y2:e.y}, g); mk('line', {x1:e.x, y1:e.y - e.s, x2:e.x, y2:e.y + e.s}, g); }
    else if (e.t === 'txt'){ g = mk('text', {x:e.x, y:e.y, fill:e.col, 'font-size':e.size, class:'mv', 'font-family':'Lex, Lexend, sans-serif'}, S); g.textContent = e.s; }
    else if (e.t === 'lab'){ g = document.createElement('div'); g.className = 'fl mv'; g.innerHTML = '<span class="mx">' + FORM[e.f] + '</span>';
      g.style.cssText = `left:${e.x}px;top:${e.y}px;font-size:${e.size}px;` + (e.anc === 'c' ? 'transform:translate(-50%,0);' : e.anc === 'r' ? 'transform:translate(-100%,0);' : '');
      L.appendChild(g); }
    if (!g) continue;
    g.id = 'fig_' + e.id;
    g.dataset.in = e.in ?? 0; if (e.out != null) g.dataset.out = e.out;
    if (e.mv) g.dataset.mv = JSON.stringify(e.mv); if (e.rot) g.dataset.rot = JSON.stringify(e.rot); if (e.col2) g.dataset.col = JSON.stringify(e.col2);
    if (e.sc) g.dataset.sc = JSON.stringify(e.sc);
    if (e.tf){ g.dataset.tf = JSON.stringify(e.tf);
      g.dataset.o = JSON.stringify(e.x1 != null ? [(e.x1 + e.x2) / 2, (e.y1 + e.y2) / 2] : [e.x || 0, e.y || 0]); }
    if (e.anc) g.dataset.anc = e.anc;
  }
}
function figAppliquer(){
  const zone = document.getElementById('figzone');
  for (const g of zone.querySelectorAll('[data-in]')){
    const a = +g.dataset.in, b = g.dataset.out != null ? +g.dataset.out : 1e9, v = step >= a && step < b;
    g.classList.toggle('on', v);
    if (g.classList.contains('fl')) g.style.opacity = v ? 1 : 0;
    let tr = g.dataset.anc === 'c' ? 'translate(-50%,0) ' : g.dataset.anc === 'r' ? 'translate(-100%,0) ' : '';
    let done = false;
    const tf = g.dataset.tf ? JSON.parse(g.dataset.tf) : null;
    if (tf && tf.some((t, j) => t[0] !== 'm' && tf.slice(0, j).some(u => u[0] === 'm'))){
      // translate(t) rotate(θ) scale(s) autour de l'origine fixe O (milieu du vecteur d'origine) : chaque centre est pris
      // dans la position atteinte au moment de l'appel ; les étapes s'interpolent proprement (même liste de fonctions)
      const [ox, oy] = JSON.parse(g.dataset.o); let tx = 0, ty = 0, th = 0, s = 1;
      for (const t of tf){ if (step < t[1]) continue;
        if (t[0] === 'm'){ tx += t[2]; ty += t[3]; }
        else if (t[0] === 'r'){ tx = 2*t[2] - 2*ox - tx; ty = 2*t[3] - 2*oy - ty; th += 180; }
        else { const f = t[4]; tx = t[2] + f*(ox + tx - t[2]) - ox; ty = t[3] + f*(oy + ty - t[3]) - oy; s *= f; } }
      g.style.transformOrigin = `${ox}px ${oy}px`; g.style.transform = `translate(${tx}px,${ty}px) rotate(${th}deg) scale(${s})`;
    }
    else {
    if (g.dataset.mv){ for (const [k, dx, dy] of JSON.parse(g.dataset.mv)) if (step >= k){ tr += `translate(${dx}px,${dy}px) `; done = true; } }
    if (g.dataset.rot){ for (const [k, cx, cy] of JSON.parse(g.dataset.rot)) if (step >= k){ tr += `rotate(180deg) `; g.style.transformOrigin = `${cx}px ${cy}px`; done = true; } }
    if (g.dataset.sc){ for (const [k, cx, cy, f] of JSON.parse(g.dataset.sc)) if (step >= k){ tr += `scale(${f}) `; g.style.transformOrigin = `${cx}px ${cy}px`; done = true; } }
    if (g.dataset.mv || g.dataset.rot || g.dataset.sc) g.style.transform = tr;
    }
    if (g.dataset.col){ let c = null; for (const [k, col] of JSON.parse(g.dataset.col)) if (step >= k) c = col;
      for (const el of g.querySelectorAll('line, path')){ el.style.stroke = c || ''; if (el.classList.contains('tete')) el.style.fill = c || ''; } }
  }
}

/* ------------------------------------------------ étapes */
function capActive(sc, k){ return sc.caps.find(c => k >= c.in && (c.out == null || k < c.out)) || null; }
function appliquer(precedent){
  const sc = SCR[cur], sec = document.getElementById('fn' + cur);
  let dernier = null, bas = -1;
  for (const e of sec.querySelectorAll('[data-in]')){
    const a = +e.dataset.in, b = e.dataset.out != null ? +e.dataset.out : 1e9, v = step >= a && step < b;
    e.classList.toggle('on', v);
    if (v && e.closest('.contenu')){ const r = rel(e, sec); if (r.y + r.h > bas && a <= step){ if (a === step || precedent > step){ bas = r.y + r.h; dernier = e; } } }
  }
  if (!dernier && (precedent < 0 || Math.abs(step - precedent) > 1)){
    for (const e of sec.querySelectorAll('.contenu [data-in].on')){ const r = rel(e, sec); if (r.y + r.h > bas){ bas = r.y + r.h; dernier = e; } } }
  if (dernier){ const vh = defil.clientHeight, top = defil.scrollTop;
    if (bas + 70 > top + vh) defil.scrollTop = bas + 90 - vh;
    else if (bas < top + 40) defil.scrollTop = Math.max(0, bas - vh * 0.6); }
  if (step === 0) defil.scrollTop = 0;
  document.getElementById('pas').textContent = `Étape ${step} / ${sc.n}`;
  document.getElementById('remplir').style.width = (100 * step / sc.n) + '%';
  figAppliquer();
  const cp = capActive(sc, precedent), cn = capActive(sc, step);
  // une donnée de l'énoncé vient d'être soulignée (ou un élément encadré en bleu) : on MONTRE l'énoncé
  const enonceNouveau = sc.ulines.some(u => u.in === step) || sc.cadres.some(c => c.in === step && c.col !== '#D62828');
  if (enonceNouveau && precedent !== step && precedent >= 0) ouvrir('enonce');
  else if (sc.figsteps.includes(step) && precedent !== step) ouvrir('figure');
  else if (cn && cn !== cp){ coursManuel = null; ouvrir('cours'); }
  else if (step === 0) ouvrir('enonce');
  else majPanneau();
}
function enonceActif(sc){ return sc.ulines.some(u => step >= u.in && (u.out == null || step < u.out)) || sc.cadres.some(c => c.col !== '#D62828' && step >= c.in && (c.out == null || step < c.out)); }
function montrer(i, k){
  document.querySelectorAll('.fn').forEach((e, j) => e.classList.toggle('cur', j === i));
  document.querySelectorAll('.vig').forEach((e, j) => e.classList.toggle('cur', j === i));
  cur = i; coursManuel = null;
  app.classList.add('saut'); construire(i); figure(i); step = k; appliquer(-1);
  if (k === 0) ouvrir('enonce');
  requestAnimationFrame(() => app.classList.remove('saut'));
}
function suivant(){ if (step < SCR[cur].n){ const p = step; step++; appliquer(p); } else if (cur < SCR.length - 1) montrer(cur + 1, 0); }
function precedentPas(){ if (step > 0){ const p = step; step--; appliquer(p); } else if (cur > 0) montrer(cur - 1, SCR[cur - 1].n); }

/* ------------------------------------------------ fiche */
function deplier(oui){ document.getElementById('panneau').classList.toggle('ferme', !oui); }
function ouvrir(t){ tab = t; deplier(true);
  document.querySelectorAll('.ong').forEach(o => o.classList.toggle('cur', o.dataset.t === t));
  document.querySelectorAll('.vue').forEach(v => v.classList.toggle('cur', v.id === 'v-' + t));
  majPanneau(); }
function majPanneau(){
  const sc = SCR[cur], k = 596 / ITEMS.w;
  // énoncé : cadres (rouge = question traitée, bleu = élément auquel on se réfère) et soulignements (données)
  const zone = document.getElementById('cadresEnonce'); zone.innerHTML = '';
  for (const c of sc.cadres){ if (!(step >= c.in && (c.out == null || step < c.out))) continue; const [x0, y0, x1, y1] = ITEMS.boxes[c.box];
    const d = document.createElement('div'); d.className = 'cadre'; d.style.cssText = `left:${x0*k - 5}px;top:${y0*k - 4}px;width:${(x1 - x0)*k + 10}px;height:${(y1 - y0)*k + 8}px;border-color:${c.col}`; zone.appendChild(d); }
  for (const u of sc.ulines){ if (!(step >= u.in && (u.out == null || step < u.out))) continue; const [x0, y0, x1, y1] = ITEMS.boxes[u.box];
    const d = document.createElement('div'); d.className = 'souligne'; d.style.cssText = `left:${x0*k}px;top:${y1*k - 1}px;width:${(x1 - x0)*k}px;border-color:${u.col}`; zone.appendChild(d); }
  // cours
  const cap = coursManuel || capActive(sc, step);
  document.getElementById('rien').style.display = cap ? 'none' : 'block';
  document.getElementById('captCours').style.display = cap ? 'inline-block' : 'none';
  if (cap) document.getElementById('imgCours').src = IMGS[cap.name];
  const noms = [...new Map(sc.caps.map(c => [c.name, c])).values()];
  const liste = document.getElementById('listeCours'); liste.innerHTML = '';
  for (const c of noms){ const b = document.createElement('button'); b.className = 'puce' + (cap && cap.name === c.name ? ' cur' : '');
    b.textContent = NOMS[c.name] || c.name; b.onclick = ev => { ev.stopPropagation(); coursManuel = c; ouvrir('cours'); }; liste.appendChild(b); }
  document.querySelector('.ong[data-t="cours"]').classList.toggle('signal', !!capActive(sc, step) && tab !== 'cours');
  document.querySelector('.ong[data-t="enonce"]').classList.toggle('signal', enonceActif(sc) && tab !== 'enonce');
  document.querySelector('.ong[data-t="figure"]').classList.toggle('signal', sc.figsteps.includes(step) && tab !== 'figure');
}

/* ------------------------------------------------ lecture automatique */
let auto = false, minuteur = null, vitesse = 'normal';
const BASE = {lent:4200, normal:2800, rapide:1700};
function duree(k){ const sc = SCR[cur], sec = document.getElementById('fn' + cur); let m = 1;
  if (sc.figsteps.includes(k)) m = 1.8;
  if (sc.ulines.some(u => u.in === k) || sc.cadres.some(c => c.in === k && c.col !== '#D62828')) m = Math.max(m, 1.6);
  if ([...sec.querySelectorAll('[data-in="' + k + '"]')].some(e => e.classList.contains('hl') || e.classList.contains('rouge'))) m = Math.max(m, 1.6);
  const a = capActive(sc, k), b = capActive(sc, k - 1); if (a && a !== b) m = Math.max(m, 1.7);
  return BASE[vitesse] * m; }
function anneau(ms){ const p = document.querySelector('#bAuto .prog'); p.style.transition = 'none'; p.style.strokeDashoffset = 62.8;
  p.getBoundingClientRect(); if (ms){ p.style.transition = `stroke-dashoffset ${ms}ms linear`; p.style.strokeDashoffset = 0; } }
function programmer(){ clearTimeout(minuteur); if (!auto) return;
  const sc = SCR[cur]; let ms;
  if (step < sc.n){ ms = duree(step); minuteur = setTimeout(() => { const p = step; step++; appliquer(p); programmer(); }, ms); }
  else if (cur < SCR.length - 1){ ms = 4500; minuteur = setTimeout(() => { montrer(cur + 1, 0); programmer(); }, ms); }
  else { lecture(false); return; }
  anneau(ms); }
function lecture(oui){ auto = oui; const b = document.getElementById('bAuto');
  b.classList.toggle('lecture', oui); b.querySelector('.lib').textContent = oui ? 'Pause' : 'Lecture auto';
  b.querySelector('.ic-play').style.display = oui ? 'none' : ''; b.querySelector('.ic-pause').style.display = oui ? '' : 'none';
  if (oui) programmer(); else { clearTimeout(minuteur); anneau(0); } }
function manuel(){ if (auto) lecture(false); }

/* ------------------------------------------------ commandes */
document.querySelectorAll('.ong').forEach(o => o.onclick = ev => { ev.stopPropagation(); ouvrir(o.dataset.t); });
document.querySelectorAll('.vig').forEach((v, j) => v.onclick = ev => { ev.stopPropagation(); manuel(); montrer(j, 0); });
document.getElementById('bPrec').onclick = () => { manuel(); precedentPas(); };
document.getElementById('bSuiv').onclick = () => { manuel(); suivant(); };
document.getElementById('bTout').onclick = () => { manuel(); const p = step; step = SCR[cur].n; appliquer(p); };
document.getElementById('bZero').onclick = () => { manuel(); montrer(cur, 0); };
document.getElementById('bAuto').onclick = () => lecture(!auto);
document.querySelectorAll('.vit button').forEach(b => b.onclick = () => { vitesse = b.dataset.v;
  document.querySelectorAll('.vit button').forEach(x => x.classList.toggle('cur', x === b)); if (auto) programmer(); });
document.getElementById('rabat').onclick = ev => { ev.stopPropagation(); deplier(false); };
document.getElementById('rouvrir').onclick = ev => { ev.stopPropagation(); deplier(true); };
document.getElementById('bOutils').onclick = () => deplier(document.getElementById('panneau').classList.contains('ferme'));
document.getElementById('bEcran').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
document.getElementById('page').addEventListener('click', ev => { if (ev.target.closest('button')) return; if (auto) lecture(false); else suivant(); });
addEventListener('keydown', ev => {
  const k = ev.key;
  if (['ArrowRight', ' ', 'Enter', 'ArrowDown'].includes(k)){ ev.preventDefault(); manuel(); suivant(); }
  else if (['ArrowLeft', 'Backspace', 'ArrowUp'].includes(k)){ ev.preventDefault(); manuel(); precedentPas(); }
  else if (k === 'PageDown'){ ev.preventDefault(); manuel(); if (cur < SCR.length - 1) montrer(cur + 1, 0); }
  else if (k === 'PageUp'){ ev.preventDefault(); manuel(); if (cur > 0) montrer(cur - 1, 0); }
  else if (k === 'Home'){ manuel(); montrer(cur, 0); }
  else if (k === 'End'){ manuel(); const p = step; step = SCR[cur].n; appliquer(p); }
  else if (/^[0-9]$/.test(k)){ manuel(); const j = k === '0' ? 9 : +k - 1; if (j < SCR.length) montrer(j, 0); }
  else if ('aA'.includes(k)) lecture(!auto);
  else if ('oO'.includes(k)) document.getElementById('bOutils').click();
  else if ('eE'.includes(k)) ouvrir('enonce'); else if ('cC'.includes(k)) ouvrir('cours');
  else if ('gGfF'.includes(k)) ouvrir('figure');
  else if ('pP'.includes(k)) document.getElementById('bEcran').click();
});
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => montrer(0, 0)));

}
function octets(b64){ const t = atob(b64), u = new Uint8Array(t.length); for (let k = 0; k < t.length; k++) u[k] = t.charCodeAt(k); return u; }
async function dechiffrer(mdp){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name:'PBKDF2', salt:octets(P.s), iterations:P.n, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:octets(P.i)}, cle, octets(P.c));
  return JSON.parse(new TextDecoder().decode(clair));
}
document.getElementById('carte').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('ouvrir'), m = document.getElementById('msg'), champ = document.getElementById('mdp');
  if (!window.crypto || !crypto.subtle){ m.className = 'err'; m.textContent = 'Ce navigateur ne permet pas d’ouvrir une page protégée.'; return; }
  b.disabled = true; m.className = ''; m.textContent = 'Ouverture…';
  let contenu;
  try { contenu = await dechiffrer(champ.value); }
  catch (e) { b.disabled = false; m.className = 'err'; m.textContent = 'Mot de passe incorrect.'; champ.select(); return; }
  // la page publiée sur claude.ai est ENVELOPPÉE dans un squelette HTML : nos <style> se retrouvent alors dans le
  // <body> ; on ne remplace donc pas tout le body (cela effacerait les styles) : on retire l'écran d'accès et on ajoute
  // le contenu à la suite
  document.getElementById('verrou').remove();
  document.body.insertAdjacentHTML('beforeend', contenu.body);
  demarrer(contenu.data);
});
