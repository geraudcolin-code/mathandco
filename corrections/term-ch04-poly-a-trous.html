/* Layout: one fixed 1280x720 "diapositive" scaled to the viewport; text column left, 3D figure right. */
:root{
  --bg:#ffffff; --fg:#161616; --muted:#6b6b72; --rule:#2b2b2b;
  --title:#17a9dc; --def:#8a0000; --ans:#0000FF; --box:#fdfdfd; --boxline:#333;
  --dots:#9a9a9a; --dotc:#6f6f6f; --cur:#fff3b0;
  --hl-p:#dcc8f5; --hl-k:#fbc9e3; --hl-g:#c9efc6; --hl-y:#fde8a3; --hl-b:#c6e4fb; --hl-o:#fdd6b0;
  --figbg:#fbfbfd; --figline:#2d2d2d; --fighid:#9c9c9c; --figface:#dfe7f2;
  --ui:#eef1f5; --uifg:#333;
  --ff-body:"LMRoman","Latin Modern Roman","CMU Serif","Times New Roman",serif;
  --ff-caps:"LMCaps","LMRoman","Latin Modern Roman Caps",serif;
  --ff-title:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --ff-math:"LMRoman","LMMath","Latin Modern Math","STIX Two Math","Cambria Math",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13161c; --fg:#ebe9e3; --muted:#9a9ca6; --rule:#cfcfcf;
  --title:#3fc1ef; --def:#ff9b9b; --ans:#8fb6ff; --box:#171b22; --boxline:#b8b8b8;
  --dots:#8a8a8a; --dotc:#9a9a9a; --cur:#4d4420;
  --hl-p:#4a3a6e; --hl-k:#6e3a57; --hl-g:#2f5e30; --hl-y:#6a5a1e; --hl-b:#2b4c6e; --hl-o:#6e4a26;
  --figbg:#1a1e26; --figline:#e4e4e4; --fighid:#8a8a8a; --figface:#2c3647;
  --ui:#232833; --uifg:#ddd; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13161c; --fg:#ebe9e3; --muted:#9a9ca6; --rule:#cfcfcf;
  --title:#3fc1ef; --def:#ff9b9b; --ans:#8fb6ff; --box:#171b22; --boxline:#b8b8b8;
  --dots:#8a8a8a; --dotc:#9a9a9a; --cur:#4d4420;
  --hl-p:#4a3a6e; --hl-k:#6e3a57; --hl-g:#2f5e30; --hl-y:#6a5a1e; --hl-b:#2b4c6e; --hl-o:#6e4a26;
  --figbg:#1a1e26; --figline:#e4e4e4; --fighid:#8a8a8a; --figface:#2c3647;
  --ui:#232833; --uifg:#ddd; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.deck{width:1280px;height:720px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--bg)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:22px 44px 18px 44px;box-sizing:border-box}
.slide.active{display:flex}

/* ---- en-tête, comme les diapos PowerPoint ---- */
.hdr{display:flex;align-items:flex-start;gap:14px;min-height:62px;margin-bottom:8px}
.by{font:600 12px/1 var(--ff-title);color:var(--fg);margin-top:4px;white-space:nowrap}
.ttl{font:400 34px/1.05 var(--ff-title);text-transform:uppercase;color:var(--title);letter-spacing:.01em;margin:0;text-wrap:balance}
.ttl small{display:block;font-size:22px;text-transform:none;color:var(--muted);margin-top:4px;letter-spacing:0}
.bar{position:absolute;left:30px;top:84px;bottom:40px;width:3px;background:var(--title);opacity:.65}

.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;min-height:0;align-items:start}
.body.nofig{grid-template-columns:minmax(0,1fr)}
.body.figbottom{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
.body.figleft{grid-template-columns:auto minmax(0,1fr)}
.body.figleft .fig{order:-1}
.txt{font-size:22px;line-height:1.42;min-width:0;display:flex;flex-direction:column;gap:10px}
.txt.small{font-size:20px}
.txt.big{font-size:26px}
.txt.xs{font-size:18px}
.fig{position:relative;background:var(--figbg);border:1px solid color-mix(in srgb,var(--figline) 25%,transparent);border-radius:10px;overflow:hidden;touch-action:none;cursor:grab}
.fig:active{cursor:grabbing}
.fig svg{display:block}
.fig .hint{position:absolute;right:8px;bottom:5px;font:11px var(--ff-title);color:var(--muted);pointer-events:none;opacity:.8}
.fig .rst{position:absolute;top:7px;right:7px;width:32px;height:32px;display:grid;place-items:center;padding:0;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--figline) 28%,transparent);background:color-mix(in srgb,var(--figbg) 85%,transparent);color:var(--figline);
  cursor:pointer;opacity:.55;transition:opacity .2s,transform .35s}
.fig:hover .rst,.fig .rst:focus-visible{opacity:1}
.fig .rst:hover{transform:rotate(-40deg)}
.fig .rst:focus-visible{outline:2px solid var(--title);outline-offset:2px}
.figrow{display:flex;gap:16px;justify-content:space-around;align-items:flex-start}
.figrow .fig{flex:0 0 auto}
.ftr{display:flex;justify-content:space-between;align-items:center;font:12px var(--ff-title);color:var(--muted);margin-top:6px}
.ftr .steps{letter-spacing:.08em}

/* ---- blocs du poly ---- */
.box{border:1.4px solid var(--boxline);border-radius:12px;padding:8px 16px 10px;background:var(--box);color:var(--def)}
.box .bt{font-weight:700;color:var(--def);margin-bottom:4px}
.box.rem{border-radius:0;color:var(--fg)}
.box.rem .bt{color:var(--fg)}
.box.plain{color:var(--fg)}
.ex{color:var(--fg)}
.exl{font-family:var(--ff-caps);font-weight:700;letter-spacing:.02em}
.exl b{font-family:var(--ff-body)}
.q{border-bottom:1.4px solid var(--rule);padding-bottom:3px;margin-top:4px}
.q b{margin-right:.3em}
.info{display:flex;gap:10px;align-items:flex-start}
.info>div:last-child{flex:1;min-width:0}
.info .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#f3a51f;color:#fff;display:grid;place-items:center;font:700 18px/1 var(--ff-title);margin-top:3px}
.info .ic.warn{background:#f6c700;color:#222;border-radius:4px;transform:rotate(45deg)}
.info .ic.warn span{transform:rotate(-45deg)}
.info .ic.lamp{background:#ffe066;color:#444}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px}
p{margin:0}
.tri{padding-left:1.3em;text-indent:-1.3em}
.tri::before{content:"▶";font-family:var(--ff-math);font-size:.75em;margin-right:.55em;position:relative;top:-.1em}
.tri2{padding-left:2.3em;text-indent:-1.3em}
.tri2::before{content:"▷";font-family:var(--ff-math);font-size:.75em;margin-right:.55em;position:relative;top:-.1em}
.bul{padding-left:1.2em;text-indent:-1.2em}
.bul::before{content:"•";margin-right:.6em}
.bul2{padding-left:2.4em;text-indent:-1.2em}
.bul2::before{content:"•";margin-right:.6em}
.ind{padding-left:2.2em}
.ctr{text-align:center}
.sep{border-top:1.4px solid var(--rule);margin:2px 0 2px}
.sc{font-family:var(--ff-caps)}
.it{font-style:italic}
.rd{color:var(--def);font-weight:700}
table.eqs{border-collapse:collapse;margin:0}
table.eqs td{padding:4px 3px;vertical-align:middle;white-space:nowrap}
table.eqs td.ql{text-align:right}
table.eqs td.qe{text-align:center;min-width:1.5em}
table.eqs td.qr{text-align:left}
table.tb{border-collapse:collapse;width:100%;font-size:.86em;color:var(--fg)}
table.tb th{background:#4472c4;color:#fff;font:700 .9em var(--ff-title);padding:4px 6px;border:1px solid var(--boxline)}
table.tb th.or{background:#ed7d31}
table.tb td{border:1px solid var(--boxline);padding:5px 8px;vertical-align:top;text-align:left}
table.tb td.c{text-align:center}
table.tb .sub{font:600 .85em var(--ff-title);text-align:center;background:color-mix(in srgb,var(--fg) 6%,transparent)}

/* ---- mathématiques ---- */
.m{font-family:var(--ff-math);white-space:nowrap;text-indent:0}
.m i{font-style:italic}
.m .op{margin:0 .2em}
.m .sp{margin:0 .14em}
.m .pc{margin-right:.28em}
.m sub,.m sup{font-size:.68em;line-height:0}
.m sub{vertical-align:-.3em}
.m sup{vertical-align:.5em}
.vec{display:inline-block;position:relative;padding:.3em .08em 0 .04em;line-height:1;margin:0 .02em;text-indent:0}
.vec::before{content:"";position:absolute;left:.05em;right:.14em;top:.14em;border-top:.085em solid currentColor}
.vec::after{content:"";position:absolute;right:.07em;top:.02em;width:.26em;height:.26em;border-top:.085em solid currentColor;border-right:.085em solid currentColor;transform:rotate(45deg) scaleY(.85)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:1em;line-height:1;margin:0 .12em;text-indent:0;position:relative;top:-.08em}
.frac .n{border-bottom:1.4px solid currentColor;padding:0 .12em .04em}
.frac .d{padding:.02em .12em 0}
.bp{font-size:1.55em;line-height:0;vertical-align:-.12em;font-weight:300}
.nrm{font-size:1.25em;line-height:0;vertical-align:-.1em;margin:0 .05em}
.cvec{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .1em}
.cvec .bp{font-size:2.9em;font-weight:200;line-height:0}
.cvec .cv{display:inline-flex;flex-direction:column;align-items:center;font-size:.95em;line-height:1.3;padding:0 .12em}
.box.meth{border-radius:6px;padding-top:0;overflow:hidden}
.box.meth .bt{background:#bcd7f0;color:#1d3b5e;margin:0 -16px 6px;padding:5px 16px;font-style:italic;font-weight:400;display:flex;gap:10px;align-items:center}
.qic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#2d6fc4;color:#fff;font:700 15px var(--ff-title);font-style:normal;flex:0 0 auto}
.scr{font-family:"LMMath","Latin Modern Math","STIX Two Math","Cambria Math",serif;font-style:normal}
.tx{font-family:var(--ff-body);white-space:normal}
.ans{color:var(--ans)}

/* ---- apparition clic par clic ---- */
/* texte écrit dans les pointillés : bleu ; dans un cadre de définition ou de propriété : rouge foncé du cadre */
.txt .r:not(.pr):not(.mk):not(.dar){color:var(--ans)}
.txt .box:not(.rem):not(.plain) .r:not(.pr):not(.mk):not(.dar){color:var(--def)}
.r{position:relative;transition:opacity .35s ease, background-color .4s ease}
.r:not(.on){opacity:0}
.r:not(.on) .r{opacity:1}           /* chunks imbriqués : seul le parent masque */
.gap{text-indent:0;text-decoration-skip-ink:none}
.gap:not(.on){opacity:1;background:repeating-linear-gradient(90deg,var(--dots) 0 2px,transparent 2px 5.5px) left bottom/100% 2px no-repeat;padding-bottom:.1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.gap:not(.on),.gap:not(.on) *{color:transparent}
.gap:not(.on) .hl{background:transparent}
/* lignes de pointillés du poly à trous : [[= …]] jusqu'au bout de la ligne, [[~W …]] largeur fixe */
.gl,.gi{position:relative;display:inline-block;white-space:nowrap;text-indent:0;vertical-align:baseline;
  background-image:radial-gradient(circle at 50% var(--cy,1.1em),var(--dotc) 0 1.05px,transparent 1.55px);
  background-size:.4em var(--th,1.42em);background-repeat:repeat-x;background-position:0 0}
.gl.glb{display:block;white-space:normal;background-repeat:repeat}
.gl .bm,.gi .bm{display:inline-block;width:0;height:0;vertical-align:baseline}
.gl .gap:not(.on),.gi .gap:not(.on){background:none;padding-bottom:0}
/* la réponse écrite masque les points qu'elle recouvre (comme sur le poly complété) ; les points restent à droite */
:root{--surf:var(--bg)} .box{--surf:var(--box)}
.gl .r.on,.gi .r.on{background-color:var(--surf);box-shadow:.24em 0 0 var(--surf),-.24em 0 0 var(--surf)}
.gl .r .r.on,.gi .r .r.on{box-shadow:none}
.gi{text-align:left}
.ph,.ph *{color:transparent!important}
.trig{font-family:var(--ff-math);font-size:.75em;position:relative;top:-.1em}
.cases{display:inline-flex;align-items:center;vertical-align:middle;text-indent:0;white-space:normal}
.cases .cbr{font-family:var(--ff-math);font-size:2.7em;line-height:1;font-weight:200;margin:0 .08em 0 0;transform:scaleX(.7)}
.cases .cl{display:inline-flex;flex-direction:column;gap:.22em}
.r.on{animation:pop .35s ease}
.r.blk{display:block}
.r.mk{display:none}
/* texte imprimé dans le poly : visible dès le départ */
.r.pr:not(.on){opacity:1}
.r.pr.on{animation:none}
.figcol{display:flex;flex-direction:column;gap:10px}
.brow{display:flex;gap:14px;align-items:center}
.bmain{flex:1;min-width:0}
.figwrap{display:contents}
@keyframes pop{from{opacity:0}to{opacity:1}}
.hl{border-radius:3px;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-p{background:var(--hl-p)} .hl-k{background:var(--hl-k)} .hl-g{background:var(--hl-g)}
.hl-y{background:var(--hl-y)} .hl-b{background:var(--hl-b)} .hl-o{background:var(--hl-o)}
/* justification sur le côté (charte § 4) : orange, avec une flèche courbe vers ce qu'elle justifie */
.just{color:#E65100;font-style:italic;font-size:.86em;white-space:nowrap;margin-left:.6em}
.just::before{content:'⤶\00a0';font-style:normal}
/* cadre rouge autour du RÉSULTAT final d'une conclusion (charte § 4) */
.cadre{display:inline-block;line-height:1.25;vertical-align:middle;border:1.6px solid #E60000;border-radius:3px;padding:.06em .22em .02em;margin:0 .06em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* point intermédiaire d'une relation de Chasles, d'une couleur à part (charte § 4, vecteurs) */
.cj{color:#E65100}
/* barre rouge datée : {st>a-b:…} n'est barré qu'à partir du clic a */
.strike.hlw:not(.lit)::after{display:none}
.txt .r.gap:not(.on),.txt .r.gap:not(.on) *{color:transparent!important}
.gap:not(.on) .cadre{border-color:transparent}
.gap:not(.on) .strike::after{display:none}
.cg{color:#18a040} .cb{color:#2b7de9} .cr{color:#e03030} .co{color:#f08a1c} .cp{color:#9b3fd6} .ck{color:#e0459a} .cgray{color:#8a8a8a}
.strike{position:relative}
.strike::after{content:"";position:absolute;left:-.05em;right:-.05em;top:50%;border-top:.1em solid #e03030;transform:rotate(-18deg)}
@media (prefers-reduced-motion: reduce){.r,.r.on{animation:none;transition:none}}

/* ---- figures SVG ---- */
.fig .edge{stroke:var(--figline);stroke-width:1.6;fill:none;stroke-linecap:round}
.fig .edge.hid{stroke:var(--fighid);stroke-dasharray:5 5;stroke-width:1.3}
.fig .face{fill:var(--figface);opacity:.35;stroke:none}
.fig .vlab{font:italic 17px var(--ff-math);fill:var(--figline);paint-order:stroke;stroke:var(--figbg);stroke-width:3px;stroke-linejoin:round}
.fig .vlab.b{font-weight:700}
.fig .plab{font:italic 19px var(--ff-math);fill:var(--figline);paint-order:stroke;stroke:var(--figbg);stroke-width:3px;stroke-linejoin:round}
.fig .pt{fill:var(--figline)}
.fig .el{transition:opacity .4s}
.fig .el.new path.ln, .fig .el.new line.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease forwards}
.fig .el.new .hd{opacity:0;animation:fadein .3s ease .4s forwards}
.fig .el.new .pop{transform-box:fill-box;transform-origin:center;animation:popin .45s cubic-bezier(.2,1.4,.5,1)}
.fig .el.new.fd{animation:fadein .5s ease}
.fig .halo{fill:none;stroke-width:2.5;animation:halo 1.4s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes halo{0%{r:6;opacity:1}100%{r:20;opacity:0}}
@media (prefers-reduced-motion: reduce){.fig .el.new path.ln,.fig .el.new line.ln,.fig .el.new .hd,.fig .el.new .pop,.fig .el.new.fd,.fig .halo{animation:none}}

/* ---- interface ---- */
#nav{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:5;opacity:.25;transition:opacity .3s}
#nav:hover,#nav:focus-within{opacity:1}
@media (max-height:520px){#nav{gap:4px}#nav button{font-size:11px;padding:3px 7px;border-radius:6px}}
#nav button,#menu button{font:14px var(--ff-title);background:var(--ui);color:var(--uifg);border:1px solid color-mix(in srgb,var(--uifg) 25%,transparent);border-radius:8px;padding:6px 10px;cursor:pointer}
#nav button:focus-visible,#menu button:focus-visible{outline:2px solid var(--title);outline-offset:2px}
#menu{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:28px 32px;box-sizing:border-box;display:none}
#menu.open{display:block}
#menu h2{font:700 20px var(--ff-title);color:var(--title);margin:0 0 10px;text-transform:uppercase}
#menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 24px;max-width:1400px}
#menu .sec{font:700 15px var(--ff-title);margin:14px 0 4px;color:var(--fg);grid-column:1/-1}
#menu .it{font:14px var(--ff-title);color:var(--fg);cursor:pointer;padding:4px 8px;border-radius:6px;display:flex;gap:8px}
#menu .it:hover{background:var(--ui)}
#menu .it.here{background:var(--cur)}
#menu .it .n{color:var(--muted);min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
#menu .keys{font:13px var(--ff-title);color:var(--muted);margin:18px 0 0;line-height:1.7}
#menu kbd{font:12px var(--ff-title);background:var(--ui);border:1px solid color-mix(in srgb,var(--uifg) 30%,transparent);border-radius:4px;padding:0 5px}
#menu .close{position:absolute;right:20px;top:20px}
#menu .sty{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px;font:14px var(--ff-title);color:var(--fg)}
#menu .sty button[aria-pressed="true"]{background:var(--title);color:var(--bg);border-color:var(--title)}
#menu .sty .k{color:var(--muted);margin-left:6px}
.fig .drg{fill:none;stroke:#e8930c;stroke-width:1.8;stroke-dasharray:3.5 2.5;opacity:0;transition:opacity .25s;pointer-events:none}
.fig:hover .drg{opacity:.75}
.fig .drg.hot{opacity:1;stroke-width:2.6;stroke-dasharray:none;fill:color-mix(in srgb,#e8930c 18%,transparent)}
/* poignées des plans (déplacer / incliner), axe de basculement, objet saisi */
.fig .drg.gico{stroke-dasharray:none;stroke-width:1.6}
.fig .drg.gico circle{fill:color-mix(in srgb,var(--figbg) 72%,transparent)}
.fig .drg.gico.hot circle{fill:color-mix(in srgb,#e8930c 24%,var(--figbg))}
.fig .drg.gico path{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fig .drg.gico path[d^="M0-4.2"]{fill:#e8930c;stroke-width:1.5}
.fig .trail{stroke-width:1.3;stroke-dasharray:3 4;opacity:.6;stroke-linecap:round}
.fig .axis{stroke:#e8930c;stroke-width:1.5;stroke-dasharray:7 5;opacity:.9}
.fig .el.hov .ln{stroke-width:4.4px;filter:drop-shadow(0 0 2.5px rgba(232,147,12,.9))}
.fig .el.hov .hd{filter:drop-shadow(0 0 2.5px rgba(232,147,12,.9))}

/* distributivité : flèches du facteur vers les termes */
.dist{display:inline-block;position:relative;padding-top:1em;line-height:1.2}
.dist .dar{position:absolute;left:0;top:0;pointer-events:none;background:none!important;box-shadow:none!important}
.dist .dar svg{overflow:visible;display:block}
.dist .dar path{fill:none;stroke:#D62828;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dist .dar[data-i="1"] path{stroke:#E65100}
.dist .dar.on path.tr{stroke-dasharray:1 1;stroke-dashoffset:1;animation:fltrace .75s cubic-bezier(.25,.8,.35,1) forwards}
.dist .dar.on path.ah{opacity:0;animation:fadein .15s ease .7s forwards}
@keyframes fltrace{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.dist .dar.on path.tr,.dist .dar.on path.ah{animation:none;stroke-dashoffset:0;opacity:1}}
.hlw{transition:background-color .35s,box-shadow .35s}
.hlw:not(.lit){background:transparent!important;box-shadow:none!important}
.cadre:has(.frac,.cvec){display:inline-block;vertical-align:middle;padding:0 .2em;margin:0 .06em}
.cadre:has(.frac):not(:has(.cvec)){line-height:1.05}
.gl > .r.on{box-shadow:.5em 0 0 var(--surf),-.24em 0 0 var(--surf)}
.gl > .r.on ~ .r.on{box-shadow:.5em 0 0 var(--surf)}
.gl .ph{background-color:var(--surf)}
.tri .gl + .gl > .bm + .ph{margin-left:-.2em}
.txt.serre{line-height:1.2}
.dist .dar:not(.on){opacity:0!important;visibility:hidden}
.dist .dar.on{opacity:1;visibility:visible}

/* =====================================================================
   Variantes de mise en page (attribut data-style sur <html>)
   classique : style d'origine (aucune règle ici)
   epure     : même plan, allégé ; barre de progression, cadres sans contour noir
   cahier    : page de cahier à petits carreaux, marge rouge, titres au feutre, réponses au stylo bleu
   tableau   : tableau noir, craies de couleur, cadre en bois
   ===================================================================== */
:root{--ff-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;--ff-chalk:"CabinSketch","Kalam","Segoe Print",cursive;--ff-sans:"FiraSans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --track:#e3e8ef;--defbg:#fbf3f1;--defline:#e7cfcb;--ink:#1d4fa3;--paper:#fdfdfb;--grid:#dbe6f3;--margin:#e2524f;--pen-red:#c8322f;--pen-green:#2e7d4f;--answer:inherit}

/* ---------------------------------------------------------------- ÉPURÉE */
:root[data-style="epure"]{--title:#1f4f8f;--muted:#5f6878;--box:#fbf3f1;--boxline:#e7cfcb;--figbg:#f5f7fa;--track:#e3e8ef}
@media (prefers-color-scheme: dark){:root[data-style="epure"]:not([data-theme="light"]){--title:#8db8ff;--muted:#9aa3b2;--box:#211b1c;--boxline:#4a3735;--figbg:#191d24;--track:#2a303a}}
:root[data-style="epure"][data-theme="dark"]{--title:#8db8ff;--muted:#9aa3b2;--box:#211b1c;--boxline:#4a3735;--figbg:#191d24;--track:#2a303a}
[data-style="epure"] .slide{padding-top:26px}
[data-style="epure"] .bar{left:0;right:0;top:0;bottom:auto;width:auto;height:5px;opacity:1;background:linear-gradient(90deg,var(--title) calc(var(--prog,0)*100%),var(--track) 0)}
[data-style="epure"] .hdr{min-height:56px;margin-bottom:10px}
[data-style="epure"] .ttl{font:600 30px/1.1 var(--ff-sans);text-transform:none;letter-spacing:-.005em}
[data-style="epure"] .ttl small{font:400 19px/1.3 var(--ff-sans);margin-top:5px}
[data-style="epure"] .by{position:absolute;left:44px;bottom:19px;margin:0;font:600 12px/1 var(--ff-sans);color:var(--muted)}
[data-style="epure"] .ftr{font-family:var(--ff-sans);padding-left:96px}
[data-style="epure"] .box{border:1px solid var(--boxline);border-radius:10px}
[data-style="epure"] .box .bt{font:600 .86em/1.35 var(--ff-sans);letter-spacing:.01em;margin-bottom:5px}
[data-style="epure"] .box.rem{background:transparent;border-color:color-mix(in srgb,var(--fg) 22%,transparent)}
[data-style="epure"] .box.meth{border-radius:10px}
[data-style="epure"] .fig{border:none;border-radius:14px}
[data-style="epure"] .q,[data-style="epure"] .sep{border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
[data-style="epure"] table.tb th{font-family:var(--ff-sans)}

/* ---------------------------------------------------------------- CAHIER */
:root[data-style="cahier"]{--bg:#fdfdfb;--fg:#1b1b1f;--muted:#6a6f7a;--rule:#3a3f4a;--title:#c8322f;--def:#8a0000;--box:#ffffff;--boxline:#c8322f;
  --dots:#8f99a6;--dotc:#6d7684;--cur:#fff0a6;--figbg:#ffffff;--figline:#2b2d33;--fighid:#9aa0a8;--figface:#dfe7f2;--ui:#eef2f7;--uifg:#333;
  --hl-p:#dcc8f5;--hl-k:#fbc9e3;--hl-g:#c9efc6;--hl-y:#fde8a3;--hl-b:#c6e4fb;--hl-o:#fdd6b0;--answer:#1d4fa3;color-scheme:light}
[data-style="cahier"] body{background:#e9edf2}
[data-style="cahier"] .deck{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px 9px}
[data-style="cahier"] .bar{left:32px;top:0;bottom:0;width:2px;opacity:.85;background:var(--margin)}
[data-style="cahier"] .hdr{gap:16px}
[data-style="cahier"] .by{font:700 15px/1 var(--ff-hand);color:var(--muted);margin-top:8px}
[data-style="cahier"] .ttl{font:700 32px/1.02 var(--ff-hand);text-transform:none;color:var(--pen-red);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px;text-decoration-color:color-mix(in srgb,var(--pen-red) 70%,transparent)}
[data-style="cahier"] .ttl small{font:700 19px/1.15 var(--ff-hand);color:var(--pen-green);text-decoration:none;margin-top:6px}
[data-style="cahier"] .ftr{font:400 14px/1.05 var(--ff-hand)}
[data-style="cahier"] .box{border:2px solid var(--boxline);border-radius:3px;box-shadow:2px 3px 0 rgba(40,50,70,.08)}
[data-style="cahier"] .box .bt{font:700 1em/1.25 var(--ff-hand);color:var(--pen-red)}
[data-style="cahier"] .box.rem{border:1.5px solid #3a3f4a;background:#fff}
[data-style="cahier"] .box.rem .bt{color:var(--ink)}
[data-style="cahier"] .box.meth{border-color:var(--ink)}
[data-style="cahier"] .box.meth .bt{font:400 1em/1.25 var(--ff-hand);font-style:normal}
[data-style="cahier"] .ex .exl{font-family:var(--ff-hand);color:var(--pen-green);letter-spacing:0}
[data-style="cahier"] .ex .exl b{font-family:var(--ff-hand)}
[data-style="cahier"] .info>div:last-child>p:first-child>b:first-child{font-family:var(--ff-hand)}
[data-style="cahier"] .fig{border:1px solid #cfd8e3;border-radius:4px;box-shadow:2px 3px 0 rgba(40,50,70,.07)}
[data-style="cahier"] .fig::before{content:"";position:absolute;top:-3px;left:50%;width:86px;height:17px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,226,130,.72);z-index:1;pointer-events:none}
[data-style="cahier"] .txt .r:not(.pr):not(.mk){color:var(--answer)}
[data-style="cahier"] .txt .r:not(.pr):not(.mk) .rd{color:var(--answer)}
[data-style="cahier"] table.tb th{font-family:var(--ff-hand);font-weight:700;line-height:1.1}
[data-style="cahier"] #menu{background:var(--paper)}

/* ---------------------------------------------------------------- TABLEAU NOIR */
:root[data-style="tableau"]{--bg:#22362e;--fg:#ecefe8;--muted:#a9b8ae;--rule:#d9dfd6;--title:#ffe27a;--def:#ffb4a6;--ans:#fff1a8;--box:transparent;--boxline:rgba(236,239,232,.78);
  --dots:#b9c5bd;--dotc:#c3cec6;--cur:rgba(255,226,122,.22);--figbg:#22362e;--figline:#eef1ec;--fighid:#9fb1a6;--figface:#a9c2b4;--ui:#2d463b;--uifg:#ecefe8;
  --hl-p:rgba(214,168,255,.28);--hl-k:rgba(255,159,210,.28);--hl-g:rgba(143,227,156,.25);--hl-y:rgba(255,226,122,.26);--hl-b:rgba(140,198,255,.26);--hl-o:rgba(255,194,122,.27);
  --answer:#fff1a8;--surf:#22362e;color-scheme:dark}
[data-style="tableau"] body{background:#151d19}
[data-style="tableau"] .deck{background:var(--bg);box-shadow:inset 0 0 0 11px #6b4a2c,inset 0 0 0 13px #4a321d}
/* traces de craie et vignettage : calque posé au-dessus du contenu, pour que les caches des réponses restent invisibles */

function demarrer(DATA){
const s = document.createElement('script'); s.textContent = DATA; document.body.appendChild(s);
}
function octets(b64){ const t = atob(b64), u = new Uint8Array(t.length); for (let k = 0; k < t.length; k++) u[k] = t.charCodeAt(k); return u; }
async function dechiffrer(mdp){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle = await crypto.subtle.deriveKey({name:'PBKDF2', salt:octets(P.s), iterations:P.n, hash:'SHA-256'}, base,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:octets(P.i)}, cle, octets(P.c));
  return JSON.parse(new TextDecoder().decode(clair));
}
document.getElementById('carte').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('ouvrir'), m = document.getElementById('msg'), champ = document.getElementById('mdp');
  if (!window.crypto || !crypto.subtle){ m.className = 'err'; m.textContent = 'Ce navigateur ne permet pas d’ouvrir une page protégée.'; return; }
  b.disabled = true; m.className = ''; m.textContent = 'Ouverture…';
  let contenu;
  try { contenu = await dechiffrer(champ.value); }
  catch (e) { b.disabled = false; m.className = 'err'; m.textContent = 'Mot de passe incorrect.'; champ.select(); return; }
  // la page publiée sur claude.ai est ENVELOPPÉE dans un squelette HTML : nos <style> se retrouvent alors dans le
  // <body> ; on ne remplace donc pas tout le body (cela effacerait les styles) : on retire l'écran d'accès et on ajoute
  // le contenu à la suite
  document.getElementById('verrou').remove();
  document.body.insertAdjacentHTML('beforeend', contenu.body);
  demarrer(contenu.data);
});
