<main>
  <section class="gouttiere">
    <div class="colonne biblio-tete">
      <div>
        <h1>Accès libre</h1>
        <p>Pour s'exercer, sans mot de passe.</p>
      </div>
    </div>

  <div class="outils gouttiere">
    <div class="colonne">
      <div class="segments" role="tablist" aria-label="Choisir un onglet" id="onglets">
        <button type="button" role="tab" id="t-seconde" aria-controls="p-seconde" aria-selected="true" data-id="seconde">Seconde</button>

      </div>
    </div>
  </div>
  <section class="gouttiere">
    <div class="colonne">
      <!-- Un onglet = un bouton ci-dessus + un panneau ci-dessous (même data-id / id p-…). -->
      <div class="panneau" role="tabpanel" id="p-seconde" aria-labelledby="t-seconde" data-id="seconde">
        <p class="vide">Des exercices pour s'entraîner arriveront bientôt ici.</p>
      </div>
      <div class="panneau" role="tabpanel" id="p-premiere" aria-labelledby="t-premiere" data-id="premiere" hidden>
